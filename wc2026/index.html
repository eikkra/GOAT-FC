<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FIFA World Cup 2026 – Powered by GOAT FC</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root{
  --bg:#040408;--bg2:#070710;--card:#0d0d1c;--card2:#111128;
  --gold:#c8a415;--gold-light:#f0c040;--red:#c8102e;
  --cyan:#00f0ff;--purple:#bf00ff;--pink:#ff007a;
  --live:#00e676;--text:#eef0ff;--muted:#5a5a80;--muted2:#333355;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden;}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 10% 10%,rgba(0,240,255,0.05) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 90% 90%,rgba(191,0,255,0.05) 0%,transparent 60%);pointer-events:none;z-index:0;}
body>*{position:relative;z-index:1;}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:9998;}

@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(0.9);}}
@keyframes glow{0%,100%{text-shadow:0 0 10px rgba(0,230,118,0.4);}50%{text-shadow:0 0 25px rgba(0,230,118,0.9),0 0 50px rgba(0,230,118,0.3);}}
@keyframes shimmer{0%{background-position:200% center;}100%{background-position:-200% center;}}
@keyframes spinBall{to{transform:translate(-50%,-50%) rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes borderRgb{0%,100%{border-color:rgba(0,240,255,0.4);}50%{border-color:rgba(191,0,255,0.4);}}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(0,230,118,0.6);}50%{box-shadow:0 0 0 5px rgba(0,230,118,0);}}

.topbar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(4,4,8,0.98);border-bottom:1px solid rgba(0,240,255,0.12);position:sticky;top:0;z-index:1000;backdrop-filter:blur(16px);}
.top-left{display:flex;align-items:center;gap:9px;}
.top-logo{width:26px;height:26px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(200,164,21,0.7)) brightness(1.15);}
.top-title-wrap{display:flex;flex-direction:column;line-height:1;}
.top-title{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,var(--gold-light),var(--cyan),var(--gold-light));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3s linear infinite;}
.top-sub{font-size:8px;color:var(--muted);letter-spacing:1.5px;margin-top:2px;}
.top-right{display:flex;align-items:center;gap:6px;}
.live-pill{display:inline-flex;align-items:center;gap:4px;background:rgba(0,230,118,0.1);border:1px solid var(--live);border-radius:20px;padding:3px 9px;font-family:'Orbitron',sans-serif;font-size:8px;font-weight:700;color:var(--live);letter-spacing:1px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 1.2s ease-in-out infinite,livePulse 1.2s ease-in-out infinite;}
.icon-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:7px;border:1px solid rgba(0,240,255,0.14);color:var(--cyan);font-size:13px;cursor:pointer;background:rgba(0,240,255,0.04);transition:all .2s;text-decoration:none;}
.icon-btn:hover{background:rgba(0,240,255,0.1);border-color:rgba(0,240,255,0.3);}
.icon-btn.gold{border-color:rgba(200,164,21,0.2);color:var(--gold);background:rgba(200,164,21,0.05);}
.icon-btn.gold:hover{background:rgba(200,164,21,0.12);border-color:rgba(200,164,21,0.35);}

.tabs-wrap{background:rgba(7,7,16,0.98);border-bottom:1px solid rgba(0,240,255,0.07);position:sticky;top:48px;z-index:999;backdrop-filter:blur(10px);}
.tabs{display:flex;max-width:1200px;margin:0 auto;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:1;min-width:70px;padding:12px 8px;font-family:'Orbitron',sans-serif;font-size:8px;font-weight:700;letter-spacing:1.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;background:none;border-left:none;border-right:none;border-top:none;display:flex;align-items:center;justify-content:center;gap:5px;}
.tab i{font-size:10px;}
.tab:hover{color:rgba(238,240,255,0.7);}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan);text-shadow:0 0 10px rgba(0,240,255,0.5);}

.main{max-width:1200px;margin:0 auto;padding:14px 10px 80px;}

.hero{background:linear-gradient(135deg,rgba(200,16,46,0.12) 0%,rgba(7,7,16,0.95) 45%,rgba(0,240,255,0.06) 100%);border:1px solid rgba(0,240,255,0.1);border-radius:14px;padding:20px 16px 18px;margin-bottom:16px;text-align:center;position:relative;overflow:hidden;animation:borderRgb 4s ease-in-out infinite;}
.hero::before{content:'⚽';position:absolute;font-size:120px;opacity:0.03;top:50%;left:50%;transform:translate(-50%,-50%);animation:spinBall 25s linear infinite;}
.hero h1{font-family:'Orbitron',sans-serif;font-size:clamp(14px,4vw,26px);font-weight:900;background:linear-gradient(90deg,var(--gold-light),var(--cyan),var(--gold-light));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3s linear infinite;letter-spacing:clamp(2px,1.5vw,5px);white-space:nowrap;}
.hero-hosts{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:10px;font-size:11px;color:var(--muted);font-family:'Exo 2',sans-serif;font-weight:600;}
.hero-host{display:flex;align-items:center;gap:5px;}
.hero-meta{display:flex;justify-content:center;gap:20px;margin-top:14px;flex-wrap:wrap;}
.hero-stat{text-align:center;}
.hero-stat-val{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;color:var(--gold);text-shadow:0 0 15px rgba(200,164,21,0.4);}
.hero-stat-label{font-size:9px;color:var(--muted);letter-spacing:2px;margin-top:2px;font-family:'Exo 2',sans-serif;}

.api-status{background:rgba(0,240,255,0.04);border:1px solid rgba(0,240,255,0.1);border-radius:8px;padding:8px 12px;font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:12px;font-family:'Exo 2',sans-serif;}
.api-status i{color:var(--cyan);font-size:12px;}

.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.filter-input{background:var(--card);border:1px solid rgba(0,240,255,0.12);border-radius:7px;padding:10px 14px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;flex:1;min-width:120px;outline:none;transition:all .2s;}
.filter-input::placeholder{color:var(--muted);}
.filter-input:focus{border-color:rgba(0,240,255,0.4);}
.filter-select{background:var(--card);border:1px solid rgba(200,164,21,0.15);border-radius:7px;padding:10px 12px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;cursor:pointer;outline:none;}

.date-divider{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;color:var(--gold);letter-spacing:2px;}
.date-divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(200,164,21,0.35),transparent);}

.flag-img{border-radius:2px;box-shadow:0 1px 4px rgba(0,0,0,0.5);object-fit:cover;flex-shrink:0;display:inline-block;vertical-align:middle;}

.match-card{background:var(--card);border:1px solid rgba(255,255,255,0.06);border-radius:10px;margin-bottom:8px;overflow:hidden;transition:all .22s;position:relative;animation:fadeUp .3s ease both;}
.match-card:hover{border-color:rgba(0,240,255,0.2);transform:translateY(-1px);box-shadow:0 4px 24px rgba(0,240,255,0.06);}
.match-card.live-card{border-color:rgba(0,230,118,0.3);box-shadow:0 0 20px rgba(0,230,118,0.08);}
.match-card.finished{border-color:rgba(200,164,21,0.2);background:linear-gradient(135deg,rgba(200,164,21,0.03),var(--card));}
.match-card-inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 14px 8px;gap:8px;}
.team-side{display:flex;align-items:center;gap:8px;}
.team-side.away{flex-direction:row-reverse;text-align:right;}
.team-side.away .team-info{align-items:flex-end;}
.team-info{display:flex;flex-direction:column;}
.team-name{font-family:'Exo 2',sans-serif;font-weight:800;font-size:clamp(10px,2.5vw,14px);line-height:1.2;}
.team-name.long{font-size:clamp(9px,2vw,12px);}
.team-name.placeholder{color:var(--muted);font-style:italic;font-size:clamp(9px,2vw,11px);}
.team-name.winner-team{color:var(--gold-light);}

.match-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:90px;}
.match-score{font-family:'Orbitron',sans-serif;font-size:clamp(20px,5vw,30px);font-weight:900;color:var(--gold-light);letter-spacing:4px;white-space:nowrap;line-height:1;}
.match-score.live-score{color:var(--live);animation:glow 2s ease-in-out infinite;}
.match-time{font-family:'Orbitron',sans-serif;font-size:clamp(13px,3.5vw,18px);font-weight:700;color:var(--text);white-space:nowrap;}
.match-time.soon{color:var(--gold-light);}
.match-status-row{display:flex;align-items:center;gap:5px;justify-content:center;}
.status-pill{border-radius:20px;padding:3px 10px;font-size:8px;font-weight:700;letter-spacing:1px;white-space:nowrap;font-family:'Orbitron',sans-serif;}
.status-pill.live{background:rgba(0,230,118,0.12);border:1px solid var(--live);color:var(--live);}
.status-pill.ft{background:rgba(200,164,21,0.1);border:1px solid rgba(200,164,21,0.4);color:var(--gold-light);}
.status-pill.upcoming{background:rgba(90,90,128,0.1);border:1px solid rgba(90,90,128,0.25);color:#7a7a9a;}
.live-minute{font-size:9px;font-weight:700;color:var(--live);display:flex;align-items:center;gap:3px;font-family:'Orbitron',sans-serif;}
.live-minute-dot{width:5px;height:5px;border-radius:50%;background:var(--live);animation:pulse 1s ease-in-out infinite;}
.countdown{font-family:'Orbitron',sans-serif;font-size:9px;color:#7070a0;}

.match-meta{display:flex;align-items:center;justify-content:center;gap:10px;padding:5px 14px 8px;border-top:1px solid rgba(255,255,255,0.04);font-size:10px;color:var(--muted);flex-wrap:wrap;font-family:'Exo 2',sans-serif;font-weight:600;}
.match-meta i{font-size:9px;color:var(--red);}
.group-strip{position:absolute;left:0;top:0;bottom:0;width:3px;}

.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;}
.group-card{background:var(--card);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.06);transition:all .2s;}
.group-card:hover{border-color:rgba(0,240,255,0.15);}
.group-card-head{padding:10px 13px;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:900;letter-spacing:2px;}
.group-team-row{display:flex;align-items:center;gap:9px;padding:7px 13px;border-top:1px solid rgba(255,255,255,0.04);transition:background .15s;}
.group-team-row:hover{background:rgba(255,255,255,0.02);}
.group-team-name{font-size:12px;font-weight:700;flex:1;font-family:'Exo 2',sans-serif;}
.group-team-pts{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:900;color:var(--gold);min-width:22px;text-align:right;}
.group-team-qual{font-size:8px;font-weight:700;letter-spacing:0.5px;font-family:'Exo 2',sans-serif;}
.group-team-qual.q{color:var(--live);}
.group-team-qual.e{color:var(--red);}
.group-col-header{display:flex;align-items:center;gap:9px;padding:4px 13px;font-size:8px;color:var(--muted);font-family:'Exo 2',sans-serif;font-weight:700;letter-spacing:1px;border-top:1px solid rgba(255,255,255,0.04);}
.group-col-header .gcol{min-width:22px;text-align:right;}

.ko-toggle{display:flex;gap:6px;margin-bottom:14px;}
.ko-btn{flex:1;padding:9px 10px;font-family:'Orbitron',sans-serif;font-size:8.5px;font-weight:700;letter-spacing:1.5px;border-radius:7px;border:1px solid rgba(0,240,255,0.12);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;}
.ko-btn.active{background:rgba(0,240,255,0.08);border-color:rgba(0,240,255,0.35);color:var(--cyan);}
.ko-btn:hover:not(.active){border-color:rgba(0,240,255,0.2);color:var(--text);}
.ko-section{margin-bottom:20px;}
.ko-phase-title{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:800;letter-spacing:2px;padding:8px 12px;border-radius:7px;margin-bottom:8px;display:flex;align-items:center;gap:7px;}
.ko-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;}

#bracketView{overflow-x:auto;padding:10px 0 20px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(0,240,255,0.2) transparent;}
#bracketView::-webkit-scrollbar{height:4px;}
#bracketView::-webkit-scrollbar-thumb{background:rgba(0,240,255,0.2);border-radius:2px;}
.bm-card{background:var(--card2);border:1px solid rgba(255,255,255,0.08);border-radius:8px;overflow:hidden;width:140px;flex-shrink:0;transition:all .2s;}
.bm-card:hover{border-color:rgba(0,240,255,0.3);}
.bm-card.is-final{border-color:rgba(200,164,21,0.4);box-shadow:0 0 20px rgba(200,164,21,0.15);width:150px;}
.bm-card.is-live{border-color:rgba(0,230,118,0.4);}
.bm-card.is-ft{border-color:rgba(200,164,21,0.2);}
.bm-date{font-family:'Orbitron',sans-serif;font-size:7.5px;color:var(--muted);text-align:center;padding:4px 6px;background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.04);letter-spacing:0.5px;}
.bm-date.live-label{color:var(--live);}
.bm-date.ft-label{color:var(--gold);}
.bm-team{display:flex;align-items:center;gap:5px;padding:5px 7px;border-bottom:1px solid rgba(255,255,255,0.04);}
.bm-team:last-of-type{border-bottom:none;}
.bm-team:hover{background:rgba(255,255,255,0.02);}
.bm-team-flag{width:18px;height:13px;flex-shrink:0;display:flex;align-items:center;}
.bm-team-name{flex:1;font-family:'Exo 2',sans-serif;font-size:9.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
.bm-team-name.winner{color:var(--gold-light);}
.bm-team-name.tbd{color:var(--muted);font-style:italic;font-size:8.5px;}
.bm-team-score{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:900;color:var(--muted2);width:16px;text-align:center;flex-shrink:0;}
.bm-team-score.winner{color:var(--gold-light);}
.bm-team-score.live-s{color:var(--live);}

.footer{text-align:center;padding:28px 20px 20px;border-top:1px solid rgba(0,240,255,0.07);margin-top:40px;}
.footer-logo{height:44px;margin-bottom:8px;filter:drop-shadow(0 0 12px rgba(200,164,21,0.5));}
.footer-title{font-family:'Orbitron',sans-serif;font-size:10px;color:var(--gold);letter-spacing:3px;margin-bottom:3px;}
.footer-sub{font-size:11px;color:var(--muted);font-family:'Exo 2',sans-serif;}
.footer-links{display:flex;justify-content:center;gap:14px;margin-top:12px;flex-wrap:wrap;}
.footer-link{color:var(--muted);font-size:12px;text-decoration:none;display:flex;align-items:center;gap:5px;transition:color .2s;}
.footer-link:hover{color:var(--gold);}

.scroll-top{position:fixed;bottom:18px;right:14px;background:var(--red);color:#fff;border:none;border-radius:50%;width:42px;height:42px;font-size:14px;cursor:pointer;box-shadow:0 4px 18px rgba(200,16,46,0.4);transition:all .2s;display:none;z-index:9997;align-items:center;justify-content:center;}
.scroll-top.show{display:flex;}
.scroll-top:hover{background:#a00c24;}
.no-match{text-align:center;padding:50px 20px;color:var(--muted);font-family:'Exo 2',sans-serif;}
.no-match i{font-size:30px;display:block;margin-bottom:12px;color:var(--red);}

@media(max-width:480px){
  .match-card-inner{padding:10px 10px 6px;gap:5px;}
  .tab{padding:10px 5px;min-width:62px;font-size:7.5px;}
  .bm-card{width:118px;}.bm-card.is-final{width:128px;}
  .bm-team-name{font-size:8.5px;}
}
@media(min-width:600px){.bm-card{width:155px;}}
@media(min-width:768px){.main{padding:16px 16px 80px;}.match-card-inner{padding:14px 18px 10px;}.bm-card{width:160px;}}
@media(min-width:1024px){.main{padding:18px 22px 80px;}}
</style>
</head>
<body>

<header class="topbar">
  <div class="top-left">
    <img src="https://i.imgur.com/LY3Bb9m.png" class="top-logo" alt="GOAT FC" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTIwIj48cGF0aCBkPSJNNTAsMiBMOTUsMjUgTDk1LDc1IFE5NSwxMTAgNTAsMTE4IFE1LDExMCA1LDc1IEw1LDI1IFoiIGZpbGw9IiMwZDBkMWEiIHN0cm9rZT0iI2M4YTQxNSIgc3Ryb2tlLXdpZHRoPSIzIi8+PHRleHQgeD0iNTAiIHk9IjU1IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjYzhhNDE1IiBmb250LXNpemU9IjE0IiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC13ZWlnaHQ9IjkwMCI+R09BVDwvdGV4dD48dGV4dCB4PSI1MCIgeT0iNzIiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiNjOGE0MTUiIGZvbnQtc2l6ZT0iMTQiIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIiBmb250LXdlaWdodD0iOTAwIj5GQzwvdGV4dD48L3N2Zz4='"/>
    <div class="top-title-wrap">
      <div class="top-title">GOAT FC</div>
      <div class="top-sub">GOATFCBD.COM</div>
    </div>
  </div>
  <div class="top-right">
    <div id="livePill" style="display:none" class="live-pill"><span class="live-dot"></span>LIVE</div>
    <button class="icon-btn gold" onclick="refreshData()" title="Refresh scores"><i class="fas fa-sync-alt" id="refreshIcon"></i></button>
    <a href="https://goatfcbd.com" class="icon-btn" title="Home"><i class="fas fa-house"></i></a>
  </div>
</header>

<div class="tabs-wrap">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('fixtures',this)"><i class="fas fa-calendar-alt"></i>FIXTURES</button>
    <button class="tab" onclick="switchTab('today',this)"><i class="fas fa-bolt"></i>TODAY</button>
    <button class="tab" onclick="switchTab('groups',this)"><i class="fas fa-layer-group"></i>GROUPS</button>
    <button class="tab" onclick="switchTab('knockout',this)"><i class="fas fa-trophy"></i>KNOCKOUT</button>
  </div>
</div>

<main class="main">
  <div class="hero">
    <h1><i class="fas fa-futbol" style="margin-right:8px;font-size:0.8em"></i>FIFA WORLD CUP 2026</h1>
    <div class="hero-hosts">
      <div class="hero-host"><img src="https://flagcdn.com/h20/us.png" height="14" class="flag-img" alt="USA">USA</div>
      <span style="color:var(--muted2)">·</span>
      <div class="hero-host"><img src="https://flagcdn.com/h20/ca.png" height="14" class="flag-img" alt="Canada">CANADA</div>
      <span style="color:var(--muted2)">·</span>
      <div class="hero-host"><img src="https://flagcdn.com/h20/mx.png" height="14" class="flag-img" alt="Mexico">MEXICO</div>
    </div>

/* ══════════════════════════════════════════
   GROUP STANDINGS CALCULATION
   Returns sorted array for each group:
   {team, MP, W, D, L, GF, GA, GD, PTS}
══════════════════════════════════════════ */
function calcGroupStandings(){
  const standings={};
  Object.keys(GROUPS).forEach(g=>{
    standings[g]={};
    GROUPS[g].forEach(t=>{
      standings[g][t]={team:t,MP:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,PTS:0};
    });
  });
  GROUP_MATCHES.forEach(m=>{
    if(m.homeScore===null||m.awayScore===null)return;
    const g=m.group;
    if(!standings[g])return;
    const h=standings[g][m.home];
    const a=standings[g][m.away];
    if(!h||!a)return;
    h.MP++;a.MP++;
    h.GF+=m.homeScore;h.GA+=m.awayScore;
    a.GF+=m.awayScore;a.GA+=m.homeScore;
    h.GD=h.GF-h.GA;a.GD=a.GF-a.GA;
    if(m.homeScore>m.awayScore){h.W++;h.PTS+=3;a.L++;}
    else if(m.homeScore<m.awayScore){a.W++;a.PTS+=3;h.L++;}
    else{h.D++;h.PTS+=1;a.D++;a.PTS+=1;}
  });
  const sorted={};
  Object.keys(standings).forEach(g=>{
    sorted[g]=Object.values(standings[g]).sort((a,b)=>{
      if(b.PTS!==a.PTS)return b.PTS-a.PTS;
      if(b.GD!==a.GD)return b.GD-a.GD;
      return b.GF-a.GF;
    });
  });
  return sorted;
}

/* ══════════════════════════════════════════
   KNOCKOUT TEAM RESOLUTION
   Based on actual group standings calculated
   from match results above.
══════════════════════════════════════════ */
function resolveKoTeams(){
  const s=calcGroupStandings();
  // Helper: get nth place in group (0-indexed)
  const p=(g,n)=>s[g]&&s[g][n]?s[g][n].team:'TBD';

  // Best 3rd place teams — pick top 4 by PTS/GD/GF from all 3rd-place teams
  const thirds=Object.keys(s).map(g=>({...s[g][2],group:g}));
  const best4thirds=thirds.filter(t=>t.MP>0).sort((a,b)=>{
    if(b.PTS!==a.PTS)return b.PTS-a.PTS;
    if(b.GD!==a.GD)return b.GD-a.GD;
    return b.GF-a.GF;
  }).slice(0,4).map(t=>t.team);

  // Fill TBD if not enough best-thirds decided yet
  while(best4thirds.length<4)best4thirds.push('TBD');

  // KNOCKOUT pairings as per FIFA 2026 R32 bracket:
  // (slot1A = 1st A, slot2A = 2nd A, etc.)
  return{
    // R32 — 16 matches
    r32_01:{home:p('A',1),away:p('B',1)},          // 2nd A vs 2nd B
    r32_02:{home:p('C',0),away:p('F',1)},           // 1st C vs 2nd F
    r32_03:{home:p('E',0),away:best4thirds[0]},     // 1st E vs Best 3rd
    r32_04:{home:p('F',0),away:p('C',1)},           // 1st F vs 2nd C
    r32_05:{home:p('E',1),away:p('I',1)},           // 2nd E vs 2nd I
    r32_06:{home:p('I',0),away:best4thirds[1]},     // 1st I vs Best 3rd
    r32_07:{home:p('A',0),away:best4thirds[2]},     // 1st A vs Best 3rd
    r32_08:{home:p('L',0),away:best4thirds[3]},     // 1st L vs Best 3rd
    r32_09:{home:p('G',0),away:p('D',1)},           // 1st G vs 2nd D  (fixed: was best3rd in orig)
    r32_10:{home:p('D',0),away:p('G',1)},           // 1st D vs 2nd G
    r32_11:{home:p('H',0),away:p('J',1)},           // 1st H vs 2nd J
    r32_12:{home:p('K',1),away:p('L',1)},           // 2nd K vs 2nd L
    r32_13:{home:p('B',0),away:p('H',1)},           // 1st B vs 2nd H (fixed)
    r32_14:{home:p('D',1),away:p('J',0)},           // 2nd D vs 1st J (fixed)
    r32_15:{home:p('J',0),away:p('H',1)},           // 1st J vs 2nd H — merged with above, use:
    r32_16:{home:p('K',0),away:p('L',2)},           // 1st K vs 3rd L (placeholder)
  };
}

/* ══ TIME UTILS ══ */
function getBDNow(){const n=new Date();return new Date(n.getTime()+n.getTimezoneOffset()*60000+6*3600000);}
function getBDDateStr(){return getBDNow().toISOString().slice(0,10);}
function matchDT(date,time){return new Date(date+'T'+time+':00+06:00');}
function formatTime(t){
  const[h,m]=t.split(':').map(Number);
  const ampm=h<12?'AM':'PM';
  const h12=h===0?12:h>12?h-12:h;
  return`${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}
function formatDate(ds){return new Date(ds+'T00:00:00').toLocaleDateString('en-BD',{weekday:'short',month:'short',day:'numeric'});}
function countdown(date,time){
  const diff=matchDT(date,time)-getBDNow();
  if(diff<=0)return'';
  const h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000);
  if(h>48){const d=Math.floor(h/24);return`${d}d ${h%24}h`;}
  return`${h}h ${m}m`;
}

/* ══ STATUS ══ */
function getStatus(m){
  if(liveData[m.id])return liveData[m.id];
  if(m.homeScore!==null&&m.homeScore!==undefined&&m.awayScore!==null&&m.awayScore!==undefined){
    return{status:'FT',homeScore:m.homeScore,awayScore:m.awayScore};
  }
  const kickoff=matchDT(m.date,m.time);
  const now=getBDNow();
  const diff=now-kickoff;
  if(diff<0)return{status:'NS'};
  if(diff<115*60000)return{status:'LIVE',minute:Math.min(Math.floor(diff/60000),90),homeScore:0,awayScore:0};
  return{status:'FT',homeScore:null,awayScore:null};
}

function tClass(n){
  if(!n||n==='TBD'||n.startsWith('W ')||n.startsWith('L '))return'team-name placeholder';
  return n.length>14?'team-name long':'team-name';
}

/* ══ CARD HTML ══ */
function cardHTML(m){
  const st=getStatus(m);
  const isLive=st.status==='LIVE';
  const isFT=st.status==='FT';
  const gc=m.group?GC[m.group]:'#c8a415';
  const timeStr=formatTime(m.time);
  const isPlaceholder=(n)=>!n||n==='TBD'||n.startsWith('W ')||n.startsWith('L ')||n.startsWith('Best');

  let center='';
  if(isLive){
    center=`<div class="match-score live-score">${st.homeScore??0} – ${st.awayScore??0}</div>
      <div class="match-status-row"><div class="live-minute"><span class="live-minute-dot"></span>${st.minute}'</div></div>`;
  } else if(isFT){
    const scoreHtml=(st.homeScore!==null&&st.awayScore!==null)
      ?`<div class="match-score">${st.homeScore} – ${st.awayScore}</div>`
      :`<div class="match-time">${timeStr}</div>`;
    center=`${scoreHtml}<div class="match-status-row"><span class="status-pill ft">FT</span></div>`;
  } else {
    const cd=countdown(m.date,m.time);
    center=`<div class="match-time${cd?' soon':''}">${timeStr}</div>
      ${cd?`<div class="countdown"><i class="far fa-clock"></i> ${cd}</div>`
          :'<div class="match-status-row"><span class="status-pill upcoming">UPCOMING</span></div>'}`;
  }

  const badge=m.phase
    ?`<span style="background:rgba(200,164,21,0.1);border:1px solid rgba(200,164,21,0.28);color:var(--gold-light);border-radius:4px;padding:1px 7px;font-size:8.5px;font-weight:700;letter-spacing:1px;font-family:'Orbitron',sans-serif;">${m.phase}</span>`
    :`<span style="background:${gc}18;border:1px solid ${gc}55;color:${gc};border-radius:4px;padding:1px 7px;font-size:8.5px;font-weight:800;font-family:'Orbitron',sans-serif;letter-spacing:1px;">GRP ${m.group}</span>`;

  const homeDisp=isPlaceholder(m.home)?`<span style="color:var(--muted);font-style:italic;font-size:11px;">${m.home||'TBD'}</span>`:m.home;
  const awayDisp=isPlaceholder(m.away)?`<span style="color:var(--muted);font-style:italic;font-size:11px;">${m.away||'TBD'}</span>`:m.away;

  return`<div class="match-card${isLive?' live-card':isFT?' finished':''}">
    ${m.group?`<div class="group-strip" style="background:linear-gradient(180deg,${gc},${gc}80)"></div>`:''}
    <div class="match-card-inner" style="padding-left:${m.group?'18px':'14px'}">
      <div class="team-side home">
        <div style="flex-shrink:0">${flagImg(m.home,22)}</div>
        <div class="team-info"><div class="${tClass(m.home)}">${homeDisp}</div></div>
      </div>
      <div class="match-center">${center}</div>
      <div class="team-side away">
        <div style="flex-shrink:0">${flagImg(m.away,22)}</div>
        <div class="team-info"><div class="${tClass(m.away)}">${awayDisp}</div></div>
      </div>
    </div>
    <div class="match-meta">
      ${badge}
      <span><i class="fas fa-map-marker-alt"></i> ${m.venue}</span>
      <span><i class="far fa-calendar"></i> ${formatDate(m.date)}</span>
    </div>
  </div>`;
}

function renderFixtures(){

    const gok=gf==='ALL'||m.group===gf;

    return gok&&sok;
  });
  if(!filtered.length){document.getElementById('fixtureList').innerHTML='<div class="no-match"><i class="fas fa-search"></i>No matches found</div>';return;}
  const byDate={};
  filtered.forEach(m=>{(byDate[m.date]=byDate[m.date]||[]).push(m);});
  let html='';
  Object.entries(byDate).sort(([a],[b])=>a.localeCompare(b)).forEach(([date,ms])=>{
    html+=`<div class="date-divider"><i class="fas fa-calendar-day" style="color:var(--red)"></i>${formatDate(date)}</div>`;
    ms.forEach(m=>{html+=cardHTML(m);});

  syncLive();
}

/* ══ RENDER BRACKET ══ */
function renderBracket(){
  injectKoTeams();
  const phases=[
    {key:'Round of 32',label:'ROUND OF 32',color:'#3498db'},
    {key:'Round of 16',label:'ROUND OF 16',color:'#1abc9c'},
    {key:'Quarterfinal',label:'QUARTER FINALS',color:'#e67e22'},
    {key:'Semifinal',label:'SEMI FINALS',color:'#9b59b6'},
    {key:'Final',label:'🏆 FINAL',color:'#c8a415'},
  ];

  function bmCard(m,isFinal){
    const st=getStatus(m);
    const isLive=st.status==='LIVE';
    const isFT=st.status==='FT';
    const isPlaceholder=(n)=>!n||n==='TBD'||n.startsWith('W ')||n.startsWith('L ')||n.startsWith('Best');

    let hs='·',as='·';
    if(isLive){hs=st.homeScore??0;as=st.awayScore??0;}
    else if(isFT&&st.homeScore!==null){hs=st.homeScore;as=st.awayScore;}

    const ds=new Date(m.date+'T00:00:00').toLocaleDateString('en-BD',{month:'short',day:'numeric'});
    const dl=isLive?`<span style="color:var(--live)">● LIVE ${st.minute}'</span>`
      :isFT?`${ds} · <span style="color:var(--gold);font-size:7px">FT</span>`
      :`${ds} · ${formatTime(m.time)}`;

    const hWin=isFT&&st.homeScore!==null&&st.homeScore>st.awayScore;
    const aWin=isFT&&st.awayScore!==null&&st.awayScore>st.homeScore;

    return`<div class="bm-card${isFinal?' is-final':''}${isLive?' is-live':''}${isFT?' is-ft':''}">
      <div class="bm-date${isLive?' live-label':isFT?' ft-label':''}">${dl}</div>
      <div class="bm-team">
        <div class="bm-team-flag">${flagImg(m.home,13)}</div>
        <div class="bm-team-name${hWin?' winner':isPlaceholder(m.home)?' tbd':''}">${m.home||'TBD'}</div>
        <div class="bm-team-score${isLive?' live-s':hWin?' winner':''}">${hs}</div>
      </div>
      <div class="bm-team">
        <div class="bm-team-flag">${flagImg(m.away,13)}</div>
        <div class="bm-team-name${aWin?' winner':isPlaceholder(m.away)?' tbd':''}">${m.away||'TBD'}</div>
        <div class="bm-team-score${isLive?' live-s':aWin?' winner':''}">${as}</div>
      </div>
    </div>`;
  }

  const phaseData=phases.map(p=>KNOCKOUT_MATCHES.filter(m=>m.phase===p.key));
  const CARD_H=72,COL_GAP=32,maxN=16;
  const totalH=maxN*CARD_H+(maxN-1)*8+40;

  let html=`<div style="font-family:'Exo 2',sans-serif;font-size:10px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px;"><i class="fas fa-arrows-left-right" style="color:var(--cyan)"></i> Scroll horizontally to see the full bracket</div>`;
  html+=`<div style="display:flex;align-items:stretch;gap:0;min-width:max-content;padding-bottom:8px;">`;

  phases.forEach((phase,pi)=>{
    const ms=phaseData[pi];
    const n=ms.length;
    const isFinal=phase.key==='Final';
    const slotH=totalH/n;

    html+=`<div style="display:flex;flex-direction:column;">`;
    html+=`<div style="text-align:center;padding:4px 8px 10px;font-family:'Orbitron',sans-serif;font-size:7.5px;font-weight:800;letter-spacing:1.5px;color:${phase.color};white-space:nowrap;min-width:${isFinal?158:148}px;">${phase.label}</div>`;
    html+=`<div style="flex:1;display:flex;flex-direction:column;">`;
    ms.forEach(m=>{
      html+=`<div style="display:flex;align-items:center;height:${slotH}px;padding:4px 0;">
        <div style="flex:1;">${bmCard(m,isFinal)}</div>
      </div>`;
    });
    html+=`</div></div>`;

    if(pi<phases.length-1){
      const nextN=phaseData[pi+1].length;
      const cSH=totalH/n;
      const nSH=totalH/nextN;
      const tO=36;
      let paths='';
      for(let ni=0;ni<nextN;ni++){
        const ci1=ni*2,ci2=ni*2+1;
        const y1=tO+ci1*cSH+cSH/2;
        const y2=tO+ci2*cSH+cSH/2;
        const midY=(y1+y2)/2;
        paths+=`<path d="M0,${y1} H${COL_GAP/2} V${midY} M${COL_GAP/2},${y2} H0 M${COL_GAP/2},${midY} H${COL_GAP}" fill="none" stroke="rgba(0,240,255,0.18)" stroke-width="1.5" stroke-linecap="round"/>`;
      }
      html+=`<div style="flex-shrink:0;width:${COL_GAP}px;position:relative;margin-top:36px;">
        <svg width="${COL_GAP}" height="${totalH}" style="position:absolute;top:0;left:0;overflow:visible;">${paths}</svg>
      </div>`;
    }
  });
  html+=`</div>`;
  document.getElementById('bracketView').innerHTML=html;
}

/* ══ API-FOOTBALL (RapidAPI) ══ */
function parseFixture(fx){
  const statusShort=fx.fixture?.status?.short||null;
  const elapsed=fx.fixture?.status?.elapsed||null;
  const homeGoals=fx.goals?.home??null;
  const awayGoals=fx.goals?.away??null;
  const homeName=normalizeTeamName(fx.teams?.home?.name);
  const awayName=normalizeTeamName(fx.teams?.away?.name);
  const LIVE_CODES=['1H','2H','HT','ET','BT','P','SUSP','INT','LIVE'];
  const FT_CODES=['FT','AET','PEN','PST','CANC','ABD','AWD','WO'];
  let status='NS';
  if(LIVE_CODES.includes(statusShort))status='LIVE';
  else if(FT_CODES.includes(statusShort))status='FT';
  return{homeName,awayName,status,minute:elapsed,homeScore:homeGoals,awayScore:awayGoals};
}
function matchTeams(apiHome,apiAway,m){
  const mh=m.home.toLowerCase(),ma=m.away.toLowerCase();
  const ah=(apiHome||'').toLowerCase(),aa=(apiAway||'').toLowerCase();
  return(ah===mh||ah.includes(mh)||mh.includes(ah))&&(aa===ma||aa.includes(ma)||ma.includes(aa));
}
async function apiFootballFetch(path){
  const key=getApiKey();if(!key)return null;
  const res=await fetch(`https://${API_HOST}${path}`,{
    method:'GET',headers:{'x-rapidapi-key':key,'x-rapidapi-host':API_HOST},cache:'no-store',
  });
  if(!res.ok)throw new Error('API '+res.status);
  return res.json();
}
async function fetchLiveFixtures(){
  let cnt=0;
  const data=await apiFootballFetch('/v3/fixtures?live=all');
  const list=(data?.response)||[];
  const allM=[...GROUP_MATCHES,...KNOCKOUT_MATCHES];
  list.forEach(fx=>{
    const p=parseFixture(fx);
    allM.forEach(m=>{
      if(!matchTeams(p.homeName,p.awayName,m))return;
      if(p.status==='LIVE'){liveData[m.id]={status:'LIVE',minute:p.minute??0,homeScore:p.homeScore??0,awayScore:p.awayScore??0};cnt++;}
      else if(p.status==='FT'){liveData[m.id]={status:'FT',homeScore:p.homeScore,awayScore:p.awayScore};cnt++;}
    });
  });
  return cnt;
}
async function fetchFixturesByDate(dateStr){
  const data=await apiFootballFetch(`/v3/fixtures?date=${dateStr}`);
  const list=(data?.response)||[];
  const allM=[...GROUP_MATCHES,...KNOCKOUT_MATCHES];
  list.forEach(fx=>{
    const p=parseFixture(fx);
    allM.forEach(m=>{
      if(m.date!==dateStr||!matchTeams(p.homeName,p.awayName,m))return;
      if(p.status==='FT'){
        liveData[m.id]={status:'FT',homeScore:p.homeScore,awayScore:p.awayScore};
        m.homeScore=p.homeScore;m.awayScore=p.awayScore;
      } else if(p.status==='LIVE'){
        liveData[m.id]={status:'LIVE',minute:p.minute??0,homeScore:p.homeScore??0,awayScore:p.awayScore??0};
      }
    });
  });
}
async function fetchResults(){
  const today=getBDDateStr();
  const y=new Date(getBDNow().getTime()-86400000).toISOString().slice(0,10);
  try{await fetchFixturesByDate(today);}catch(e){}
  try{await fetchFixturesByDate(y);}catch(e){}
}

function syncLive(){
  const hasLive=Object.values(liveData).some(d=>d.status==='LIVE')||
    [...GROUP_MATCHES,...KNOCKOUT_MATCHES].some(m=>getStatus(m).status==='LIVE');
  document.getElementById('livePill').style.display=hasLive?'inline-flex':'none';
}
function updateStatus(msg){document.getElementById('apiStatusText').textContent=msg;}

/* ══ REFRESH ══ */
async function refreshData(){
  const icon=document.getElementById('refreshIcon');
  icon.classList.add('fa-spin');
  if(!getApiKey()){
    updateStatus('No API key · Showing confirmed results only');
    renderAll();setTimeout(()=>icon.classList.remove('fa-spin'),600);return;
  }
  updateStatus('Fetching latest scores…');
  let c=0;
  try{c=await fetchLiveFixtures();await fetchResults();}catch(e){c=-1;}
  renderAll();
  const t=getBDNow().toLocaleTimeString('en-BD',{hour:'2-digit',minute:'2-digit'});
  if(c<0)updateStatus(`API unavailable · Showing confirmed results · ${t}`);
  else if(c>0)updateStatus(`● ${c} live update(s) · Last sync ${t}`);
  else updateStatus(`Scores confirmed · Last sync ${t}`);
  syncLive();
  setTimeout(()=>icon.classList.remove('fa-spin'),600);
}

function renderAll(){
  injectKoTeams();
  renderFixtures();renderToday();renderGroups();renderKnockoutList();
  if(koView==='bracket')renderBracket();
}

/* ══ TABS ══ */
function switchTab(tab,el){
  ['fixtures','today','groups','knockout'].forEach(t=>document.getElementById('tab-'+t).style.display='none');
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).style.display='block';
  el.classList.add('active');
  if(tab==='knockout'&&koView==='bracket')renderBracket();
}

function calcDaysLeft(){
  const diff=new Date('2026-07-19T00:00:00+06:00')-getBDNow();
  const el=document.getElementById('daysLeft');
  if(el)el.textContent=diff>0?Math.ceil(diff/86400000):'🏆';
}

window.addEventListener('scroll',()=>document.getElementById('scrollTop').classList.toggle('show',window.scrollY>300));

/* ══ INIT ══ */
document.addEventListener('DOMContentLoaded',async()=>{
  calcDaysLeft();
  injectKoTeams();
  renderAll();

  if(!getApiKey()){
    updateStatus('No API key · Showing confirmed/hardcoded results only');
    syncLive();return;
  }
  updateStatus('Checking for live updates…');
  let c=0;
  try{c=await fetchLiveFixtures();await fetchResults();}catch(e){c=-1;}
  renderAll();
  const t=getBDNow().toLocaleTimeString('en-BD',{hour:'2-digit',minute:'2-digit'});
  if(c<0)updateStatus(`API unavailable · Showing confirmed results · ${t}`);
  else if(c>0)updateStatus(`● ${c} live match update(s) · Synced ${t}`);
  else updateStatus(`All scores up to date · Synced ${t}`);
  syncLive();

  // Auto-refresh every 60s
  setInterval(async()=>{
    if(!getApiKey())return;
    let cv=0;
    try{cv=await fetchLiveFixtures();await fetchResults();}catch(e){cv=-1;}
    renderAll();
    const tv=getBDNow().toLocaleTimeString('en-BD',{hour:'2-digit',minute:'2-digit'});
    if(cv<0)updateStatus(`API unavailable · ${tv}`);
    else if(cv>0)updateStatus(`● ${cv} live update(s) · Synced ${tv}`);
    else updateStatus(`Scores up to date · Synced ${tv}`);
    syncLive();
  },60000);
});
</script>
