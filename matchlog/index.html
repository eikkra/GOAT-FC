<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC MATCH LOG</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png">

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:#020617;
    color:#e2e8f0;
}

/* HEADER */
.header{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    padding:10px;
}

.header img{
    width:40px;
}

.header h1{
    color:#00f5ff;
    text-shadow:0 0 15px #00f5ff,0 0 25px #00f5ff;
    font-size:20px;
}

/* DESCRIPTION */
.desc{
    text-align:center;
    font-size:12px;
    color:#94a3b8;
}

/* FILTER */
.filter-box{
    display:flex;
    justify-content:center;
    gap:6px;
    flex-wrap:nowrap;
    padding:10px;
}

select,input,button{
    padding:6px;
    border-radius:6px;
    border:1px solid #00f5ff;
    background:black;
    color:#00f5ff;
    font-size:11px;
}

button{
    background:#00f5ff;
    color:black;
    font-weight:bold;
}

/* TABLE */
.container{
    max-height:75vh;
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    position:sticky;
    top:0;
    background:#020617;
    z-index:10;
}

th{
    color:#00f5ff;
    text-shadow:0 0 10px #00f5ff;
    padding:8px;
    border-bottom:2px solid #00f5ff;
}

td{
    padding:8px;
    text-align:center;
}

tr{
    border-bottom:1px solid #0f172a;
}

/* RESULT COLORS */
.win{color:#22c55e;}
.loss{color:#ef4444;}
.draw{color:#facc15;}

/* GOLD EFFECT */
.gold{
    color:gold;
    text-shadow:0 0 10px gold,0 0 20px gold;
    font-weight:bold;
}

/* MOBILE */
@media(max-width:768px){
    .filter-box{
        overflow-x:auto;
    }
    th,td{
        font-size:11px;
    }
}
</style>
</head>

<body>

<div class="header">
    <img src="https://i.imgur.com/LY3Bb9m.png">
    <h1>GOAT FC MATCH LOG</h1>
</div>

<div class="desc">
Live approved match logs filtered by tournament type and date range.
</div>

<div class="filter-box">
<select id="matchType">
<option value="">All</option>
<option>Friendly</option>
<option>Solo Tournament</option>
<option>Bid Tournament</option>
<option>League</option>
<option>Co-op</option>
</select>

<input type="date" id="startDate">
<input type="date" id="endDate">

<button onclick="applyFilter()">Filter</button>
</div>

<div class="container">
<table>
<thead>
<tr>
<th>Date</th>
<th>Type</th>
<th>Player 1</th>
<th>Player 2</th>
<th>Score</th>
<th>Points</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>
</div>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv";

let allData = [];

// 🔥 Convert sheet date → YYYY-MM-DD
function convertSheetDate(d){
    if(!d) return "";
    const parts = d.split(" ")[0].split("/"); // remove time
    let m = parts[0].padStart(2,"0");
    let d2 = parts[1].padStart(2,"0");
    let y = parts[2];
    return `${y}-${m}-${d2}`;
}

// FAST PARSER
function fastCSV(csv){
    const lines = csv.split("\n");
    const result = [];

    for(let i=1;i<lines.length;i++){
        if(!lines[i]) continue;
        const r = lines[i].split(",");

        result.push({
            dateRaw: r[11],
            date: convertSheetDate(r[11]), // ✅ fixed
            type: r[2],
            p1: r[0],
            p2: r[1],
            s1: parseInt(r[3]),
            s2: parseInt(r[4]),
            pt1: parseInt(r[5]),
            pt2: parseInt(r[6]),
            approved: r[9]
        });
    }
    return result;
}

// LOAD
async function loadData(){
    const res = await fetch(CSV_URL);
    const text = await res.text();
    allData = fastCSV(text).filter(r=>r.approved==="yes");
    applyFilter();
}

// FILTER (NOW PERFECT)
function applyFilter(){
    const type = document.getElementById("matchType").value;
    const start = document.getElementById("startDate").value;
    const end = document.getElementById("endDate").value;

    let filtered = allData;

    if(type){
        filtered = filtered.filter(r => r.type === type);
    }

    if(start){
        filtered = filtered.filter(r => r.date >= start);
    }

    if(end){
        filtered = filtered.filter(r => r.date <= end);
    }

    render(filtered);
}

// RENDER
function render(data){
    const tbody = document.getElementById("tableBody");
    let html="";

    data.slice(0,500).forEach(r=>{

        let p1Class="", p2Class="";

        if(r.s1 > r.s2){
            p1Class="win"; p2Class="loss";
        }else if(r.s1 < r.s2){
            p1Class="loss"; p2Class="win";
        }else{
            p1Class="draw"; p2Class="draw";
        }

        let scoreClass = (r.s1>=7 || r.s2>=7) ? "gold" : "";

        html += `
        <tr>
            <td>${r.date}</td>
            <td>${r.type}</td>
            <td class="${p1Class}">${r.p1}</td>
            <td class="${p2Class}">${r.p2}</td>
            <td class="${scoreClass}">${r.s1} - ${r.s2}</td>
            <td>${r.pt1} - ${r.pt2}</td>
        </tr>`;
    });

    tbody.innerHTML = html;
}

// INIT
loadData();

</script>

</body>
</html>
