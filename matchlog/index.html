<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC MATCH LOG</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png">

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#020617;
    color:#e2e8f0;
}

/* HEADER (logo + title same row) */
.header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:10px;
}
.header img{
    width:40px;
}
.header h1{
    margin:0;
    color:#00f5ff;
    text-shadow:0 0 15px #00f5ff;
    font-size:20px;
}

/* DESCRIPTION */
.desc{
    text-align:center;
    font-size:12px;
    color:#94a3b8;
    margin-bottom:10px;
}

/* FILTER (one row mobile friendly) */
.filter-box{
    display:flex;
    gap:6px;
    padding:10px;
    justify-content:center;
    flex-wrap:wrap;
}

select,input,button{
    padding:7px;
    border-radius:6px;
    border:1px solid #00f5ff;
    background:black;
    color:#00f5ff;
    font-size:12px;
}

button{
    background:#00f5ff;
    color:black;
    font-weight:bold;
}

/* TABLE */
.container{
    max-height:70vh;
    overflow:auto;
}

/* STICKY HEADER */
thead th{
    position:sticky;
    top:0;
    background:#020617;
    z-index:2;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:8px;
    text-align:center;
    font-size:12px;
}

/* ROW SEPARATOR */
tr{
    border-bottom:1px solid #1e293b;
}

/* POINT COLORS */
.win{
    color:#22c55e;
    font-weight:bold;
}
.draw{
    color:#eab308;
    font-weight:bold;
}

/* BIG SCORE ANIMATION */
.big-score{
    color:#facc15;
    font-weight:bold;
    animation:glow 1s infinite alternate;
}
@keyframes glow{
    from{ text-shadow:0 0 5px gold; }
    to{ text-shadow:0 0 20px gold; }
}

/* MOBILE */
@media(max-width:768px){
    th,td{
        font-size:11px;
        padding:6px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <img src="https://i.imgur.com/LY3Bb9m.png">
    <h1>GOAT FC MATCH LOG</h1>
</div>

<div class="desc">
Track all approved matches by type and date. Filter tournament logs instantly and view player performance history.
</div>

<!-- FILTER -->
<div class="filter-box">
<select id="matchType">
<option value="">All</option>
<option>Friendly</option>
<option>Solo Tournament</option>
<option>Bid Tournament</option>
<option>League</option>
<option>Co-op</option>
</select>

<input type="date" id="startDate" placeholder="Start Date">
<input type="date" id="endDate" placeholder="End Date">

<button onclick="applyFilter()">Filter</button>
</div>

<!-- TABLE -->
<div class="container">
<table>
<thead>
<tr>
<th>Date</th>
<th>Type</th>
<th>Player 1</th>
<th>Player 2</th>
<th>Score</th>
<th>Points</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv";

let allData = [];

// FAST CSV
function fastCSV(csv){
    const lines = csv.split("\n");
    const result = [];

    for(let i=1;i<lines.length;i++){
        if(!lines[i]) continue;
        const row = lines[i].split(",");
        result.push({
            date: row[11],
            type: row[2],
            p1: row[0],
            p2: row[1],
            s1: parseInt(row[3]),
            s2: parseInt(row[4]),
            pt1: row[5],
            pt2: row[6],
            approved: row[9]
        });
    }
    return result;
}

async function loadData(){
    const res = await fetch(CSV_URL);
    const text = await res.text();
    allData = fastCSV(text).filter(r=>r.approved==="yes");
    applyFilter();
}

function formatDate(d){
    return d ? d.split(" ")[0] : "";
}

function applyFilter(){

    const type = document.getElementById("matchType").value;
    const start = document.getElementById("startDate").value;
    const end = document.getElementById("endDate").value;

    let data = allData;

    if(type) data = data.filter(r=>r.type===type);
    if(start) data = data.filter(r=>r.date>=start);
    if(end) data = data.filter(r=>r.date<=end);

    render(data);
}

function render(data){
    const tbody = document.getElementById("tableBody");

    let html="";

    data.slice(0,500).forEach(r=>{

        // point color
        let p1Class="", p2Class="";
        if(r.pt1 > r.pt2) p1Class="win";
        else if(r.pt1 < r.pt2) p2Class="win";
        else { p1Class="draw"; p2Class="draw"; }

        // big score check
        let scoreClass="";
        if((r.s1>=7 || r.s2>=7)) scoreClass="big-score";

        html+=`
        <tr>
            <td>${formatDate(r.date)}</td>
            <td>${r.type}</td>
            <td>${r.p1}</td>
            <td>${r.p2}</td>
            <td class="${scoreClass}">${r.s1} - ${r.s2}</td>
            <td>
                <span class="${p1Class}">${r.pt1}</span> - 
                <span class="${p2Class}">${r.pt2}</span>
            </td>
        </tr>`;
    });

    tbody.innerHTML = html;
}

loadData();

</script>

</body>
</html>
