<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC MATCH LOG</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png">

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:#020617;
    color:#e2e8f0;
}

/* HEADER */
.header{
    text-align:center;
    padding:10px;
}

.header img{
    width:45px;
}

.header h1{
    margin:5px 0 0;
    color:#00f5ff;
    text-shadow:0 0 15px #00f5ff;
    font-size:20px;
}

.desc{
    text-align:center;
    font-size:12px;
    color:#94a3b8;
    margin-bottom:10px;
}

/* FILTER */
.filter-box{
    display:flex;
    gap:6px;
    padding:10px;
    justify-content:center;
    flex-wrap:wrap;
}

select,input,button{
    padding:7px;
    border-radius:6px;
    border:1px solid #00f5ff;
    background:black;
    color:#00f5ff;
    font-size:12px;
}

button{
    background:#00f5ff;
    color:black;
    font-weight:bold;
}

/* TABLE */
.container{
    padding:10px;
    max-height:70vh;
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:7px;
    font-size:12px;
    text-align:center;
}

th{
    color:#00f5ff;
}

tr{
    border-bottom:1px solid #0f172a;
}

/* MOBILE */
@media(max-width:768px){
    th,td{
        font-size:11px;
    }
}
</style>
</head>

<body>

<div class="header">
    <img src="https://i.imgur.com/LY3Bb9m.png">
    <h1>GOAT FC MATCH LOG</h1>
</div>

<div class="desc">
Live match records filtered by tournament type and date. Only approved matches are displayed for accurate tracking.
</div>

<div class="filter-box">
<select id="matchType">
<option value="">All</option>
<option>Friendly</option>
<option>Solo Tournament</option>
<option>Bid Tournament</option>
<option>League</option>
<option>Co-op</option>
</select>

<input type="date" id="startDate">
<input type="date" id="endDate">

<button onclick="applyFilter()">Filter</button>
</div>

<div class="container">
<table>
<thead>
<tr>
<th>Date</th>
<th>Type</th>
<th>Player 1</th>
<th>Player 2</th>
<th>Score</th>
<th>Points</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv";

let allData = [];

// ⚡ FAST CSV PARSER
function fastCSV(csv){
    const lines = csv.split("\n");
    const headers = lines[0].split(",");
    const result = [];

    for(let i=1;i<lines.length;i++){
        if(!lines[i]) continue;
        const row = lines[i].split(",");
        result.push({
            Match_Date: row[11],
            Match_Type: row[2],
            P1_ID: row[0],
            P2_ID: row[1],
            P1_Score: row[3],
            P2_Score: row[4],
            P1_Point: row[5],
            P2_Point: row[6],
            Approved: row[9]
        });
    }
    return result;
}

// ⚡ LOAD (only once)
async function loadData(){
    const res = await fetch(CSV_URL);
    const text = await res.text();
    allData = fastCSV(text).filter(r => r.Approved === "yes"); // pre-filter
    applyFilter();
}

// ⚡ FORMAT DATE ONLY
function formatDate(d){
    if(!d) return "";
    return d.split(" ")[0];
}

// ⚡ FILTER FAST
function applyFilter(){

    const type = document.getElementById("matchType").value;
    const start = document.getElementById("startDate").value;
    const end = document.getElementById("endDate").value;

    let filtered = allData;

    if(type){
        filtered = filtered.filter(r => r.Match_Type === type);
    }

    if(start){
        filtered = filtered.filter(r => r.Match_Date >= start);
    }

    if(end){
        filtered = filtered.filter(r => r.Match_Date <= end);
    }

    renderTable(filtered);
}

// ⚡ RENDER (fast DOM)
function renderTable(data){
    const tbody = document.getElementById("tableBody");

    let html = "";

    data.slice(0,500).forEach(row => {  // LIMIT = performance boost
        html += `
        <tr>
            <td>${formatDate(row.Match_Date)}</td>
            <td>${row.Match_Type}</td>
            <td>${row.P1_ID}</td>
            <td>${row.P2_ID}</td>
            <td>${row.P1_Score} - ${row.P2_Score}</td>
            <td>${row.P1_Point} - ${row.P2_Point}</td>
        </tr>`;
    });

    tbody.innerHTML = html;
}

// INIT
loadData();

</script>

</body>
</html>
