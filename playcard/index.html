<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC PLAY CARD</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif;}

body{background:#050505;color:#fff;}

/* HEADER */
.header{
display:flex;
align-items:center;
justify-content:center;
gap:12px;
padding:15px;
}

.logo{
width:45px;
filter:drop-shadow(0 0 10px #00f7ff) drop-shadow(0 0 20px #00f7ff);
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{filter:drop-shadow(0 0 5px #00f7ff);}
to{filter:drop-shadow(0 0 25px #00f7ff);}
}

.title{
font-size:22px;
color:#00f7ff;
text-shadow:0 0 10px #00f7ff;
}

/* DESC */
.desc{
text-align:center;
padding:10px;
color:#aaa;
font-size:13px;
}

/* SEARCH */
.search-box{
text-align:center;
margin:15px 0;
}

.search-box input{
padding:12px;
width:90%;
max-width:320px;
border-radius:10px;
border:none;
background:#111;
color:#00f7ff;
box-shadow:0 0 10px #00f7ff;
}

/* TABLE */
.container{padding:10px;}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#111;
color:#00f7ff;
padding:12px;
}

td{
padding:10px;
text-align:center;
border-bottom:1px solid #222;
}

tr:hover{
background:rgba(0,247,255,0.08);
}

/* LABEL COLOR */
td::before{
color:#00f7ff;
}

/* VALUE COLORS */
.club{color:#00ff9d;text-shadow:0 0 6px #00ff9d;}
.konami{color:#ff9f00;text-shadow:0 0 6px #ff9f00;}
.device{color:#c77dff;text-shadow:0 0 6px #c77dff;}

/* FB BUTTON */
.fb-btn{
display:inline-block;
padding:6px 10px;
border:1px solid #00f7ff;
border-radius:6px;
color:#00f7ff;
}

.fb-btn:hover{
background:#00f7ff;
color:#000;
}

/* MOBILE */
@media(max-width:768px){

table,thead,tbody,th,td,tr{
display:block;
}

thead{display:none;}

tr{
margin-bottom:12px;
background:#0b0b0b;
border-radius:10px;
box-shadow:0 0 8px rgba(0,247,255,0.2);
padding:10px;
}

td{
text-align:left;
padding:6px;
border:none;
}

td::before{
content:attr(data-label);
font-weight:bold;
display:block;
margin-bottom:2px;
}

}

/* FOOTER */
.footer{
text-align:center;
padding:15px;
font-size:12px;
color:#777;
margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
<img src="https://i.imgur.com/LY3Bb9m.png" class="logo">
<div class="title">GOAT FC PLAY CARD</div>
</div>

<div class="desc">
Official GOAT FC tournament player database. Search players using Club ID and view their registered game details instantly.
</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Search by Club ID...">
</div>

<div class="container">
<table>
<thead>
<tr>
<th>Player Name</th>
<th>Club ID</th>
<th>KONAMI ID</th>
<th>Device</th>
<th>Facebook</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<div class="footer">© GOAT FC Tournament System</div>

<script>
const csvURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRxNxMgcwsp3k8B9jqnfObnnRfhSX3vUcEOuaPTsyEMaEVOZKE9OIcLiMQRJHHkAQiJWn-msKE6Cs80/pub?output=csv";

let players=[];

/* Normalize function */
function normalize(str){
return (str || "")
.toLowerCase()
.replace(/[^a-z0-9]/g,""); // remove dash, space
}

function loadData(){
Papa.parse(csvURL,{
download:true,
header:true,
skipEmptyLines:true,
complete:function(res){
players=res.data;
render(players);
}
});
}

function render(data){
const tbody=document.getElementById("tableBody");
tbody.innerHTML="";

data.forEach(p=>{
tbody.innerHTML+=`
<tr>
<td data-label="Player Name">${p["Player Name"]||""}</td>
<td data-label="Club ID" class="club">${p["Your Club ID"]||""}</td>
<td data-label="KONAMI ID" class="konami">${p["KONAMI ID"]||""}</td>
<td data-label="Device" class="device">${p["DEVICE NAME"]||""}</td>
<td data-label="Facebook">
<a href="${p["Facebook URL"]}" target="_blank" class="fb-btn">
<i class="fab fa-facebook-f"></i>
</a>
</td>
</tr>`;
});
}

/* SMART SEARCH */
document.getElementById("searchInput").addEventListener("keyup",function(){
let val=normalize(this.value);

let filtered=players.filter(p=>{
let club=normalize(p["Your Club ID"]);
return club.includes(val);
});

render(filtered);
});

loadData();
setInterval(loadData,30000);
</script>

</body>
</html>
