<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  background:#0b1220;
  color:white;
  overflow:hidden;
}

/* ===== HEADER (THIN GAMING STYLE) ===== */
.header{
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:rgba(10,12,25,0.85);
  backdrop-filter: blur(14px);
  border-bottom:1px solid rgba(0,247,255,0.15);
  position:fixed;
  top:0;
  width:100%;
  z-index:1000;
}

/* LOGO GAMING PULSE */
.header img{
  height:24px;
  animation: logoPulse 2.5s infinite;
  filter: drop-shadow(0 0 6px #00f7ff);
}

@keyframes logoPulse{
  0%,100%{
    transform: scale(1);
    filter: drop-shadow(0 0 6px #00f7ff);
  }
  50%{
    transform: scale(1.08);
    filter: drop-shadow(0 0 14px #00f7ff);
  }
}

/* GAMING TITLE */
.header h1{
  font-size:15px;
  font-weight:800;
  letter-spacing:2px;
  text-transform:uppercase;

  background: linear-gradient(90deg,#00f7ff,#a855f7,#ff00c8,#00f7ff);
  background-size:300% 100%;
  animation: neonFlow 4s linear infinite;

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  text-shadow:0 0 10px rgba(0,247,255,0.2);
}

@keyframes neonFlow{
  0%{ background-position:0% }
  100%{ background-position:300% }
}

/* ===== MAIN ===== */
.main{
  position:absolute;
  top:42px;
  bottom:42px;
  width:100%;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

/* ===== FOOTER (THIN GAMING STYLE) ===== */
.footer{
  height:42px;
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  align-items:center;

  background:rgba(10,12,25,0.9);
  backdrop-filter: blur(14px);
  border-top:1px solid rgba(0,247,255,0.12);
}

/* FOOTER LINKS */
.footer a{
  text-decoration:none;
  color:#cbd5e1;
  font-size:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  transition:0.25s;
  position:relative;
}

/* ICON */
.footer i{
  font-size:14px;
  margin-bottom:2px;
  transition:0.25s;
}

/* HOVER GAMING EFFECT */
.footer a:hover{
  color:#00f7ff;
  transform:translateY(-2px);
}

.footer a:hover i{
  color:#00f7ff;
  text-shadow:0 0 12px #00f7ff;
  transform: scale(1.15);
}

/* UNDERLINE ANIMATION */
.footer a::after{
  content:'';
  position:absolute;
  bottom:-5px;
  width:0;
  height:2px;
  background:#00f7ff;
  border-radius:10px;
  transition:0.3s;
}

.footer a:hover::after{
  width:60%;
}

/* MOBILE */
@media(max-width:600px){
  .header{
    height:38px;
  }

  .header img{
    height:20px;
  }

  .header h1{
    font-size:13px;
  }

  .footer{
    height:38px;
  }

  .footer i{
    font-size:13px;
  }

  .footer a{
    font-size:9px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <img src="https://i.imgur.com/LY3Bb9m.png" alt="logo">
  <h1>GOAT FC</h1>
</div>

<!-- MAIN -->
<div class="main">
  <iframe id="mainFrame"></iframe>
</div>

<!-- FOOTER -->
<div class="footer">
  <a id="home"><i class="fas fa-home"></i>Home</a>
  <a id="register"><i class="fas fa-user-plus"></i>Register</a>
  <a id="score"><i class="fas fa-upload"></i>Score</a>
  <a id="view"><i class="fas fa-file-lines"></i>View</a>
</div>

<script>

const sheetURL = "https://opensheet.elk.sh/1ZoXNHa5sYiP_HaPRyL5RDML7l3kC2IaGuQCAmYkERf8/CONFIG";

fetch(sheetURL)
  .then(res => res.json())
  .then(data => {

    let config = {};
    data.forEach(row => {
      config[row.key] = row.value;
    });

    document.getElementById("mainFrame").src = config.main_link;

    document.getElementById("home").href = config.home_link;
    document.getElementById("register").href = config.register_link;
    document.getElementById("score").href = config.score_link;
    document.getElementById("view").href = config.view_link;

  })
  .catch(err => console.log(err));

</script>

</body>
</html>
