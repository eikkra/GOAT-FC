<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>GOAT FC — Trial Tracker</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&family=Exo+2:wght@600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#060f08;--s1:#0a140c;--s2:#0e1a10;--s3:#111e13;
  --br:#1a2e1c;--br2:#1f3821;
  --gn:#00e676;--gn2:#00c853;--gn3:#69f0ae;--gnd:#004d20;
  --tx:#e8f5e9;--mu:#4a7a52;--mu2:#2e5535;
  --cy:#00e5ff;--yw:#ccff90;--rd:#ff5252;--or:#ffab40;--wh:#ffffff;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes borderPulse{0%,100%{border-color:rgba(0,230,118,.2)}50%{border-color:rgba(0,230,118,.55)}}
html,body{height:100%;-webkit-font-smoothing:antialiased;}
body{background:var(--bg);font-family:'Rajdhani',sans-serif;color:var(--tx);min-height:100vh;overflow-x:hidden;}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(0,230,118,.06) 0%,transparent 55%),radial-gradient(ellipse at 80% 100%,rgba(0,229,255,.04) 0%,transparent 50%);pointer-events:none;z-index:0;}
body::after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px);pointer-events:none;z-index:0;opacity:.5;}

/* TOPBAR */
.topbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(6,15,8,.97);border-bottom:1px solid rgba(0,230,118,.18);position:sticky;top:0;z-index:999;backdrop-filter:blur(20px);box-shadow:0 2px 24px rgba(0,0,0,.6);}
.top-left{display:flex;align-items:center;gap:8px;text-decoration:none;}
.top-logo{width:20px;filter:drop-shadow(0 0 8px rgba(0,230,118,.8)) brightness(1.2);}
.top-title{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:900;letter-spacing:3px;color:var(--gn);text-shadow:0 0 12px rgba(0,230,118,.5);}
.admin-btn{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;border:1px solid rgba(0,230,118,.25);background:rgba(0,230,118,.07);color:var(--gn);font-family:'Exo 2',sans-serif;font-size:8px;font-weight:800;letter-spacing:1.5px;text-decoration:none;text-transform:uppercase;transition:all .2s;}
.admin-btn:hover{border-color:rgba(0,230,118,.55);background:rgba(0,230,118,.14);}
.admin-btn i{font-size:9px;}

/* HERO */
.hero{position:relative;z-index:1;text-align:center;padding:20px 14px 16px;border-bottom:1px solid rgba(0,230,118,.1);background:linear-gradient(180deg,rgba(0,230,118,.04) 0%,transparent 100%);}
.hero-badge{display:inline-flex;align-items:center;gap:5px;font-family:'Exo 2',sans-serif;font-size:7px;font-weight:800;letter-spacing:3px;color:var(--gn);text-transform:uppercase;background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.22);padding:3px 10px;border-radius:20px;margin-bottom:10px;}
.hero-badge i{font-size:8px;animation:pulse 2s ease-in-out infinite;}
.hero-title{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;letter-spacing:5px;color:var(--gn);text-shadow:0 0 30px rgba(0,230,118,.5),0 0 60px rgba(0,230,118,.2);line-height:1;margin-bottom:6px;}
.hero-title span{color:var(--tx);opacity:.7;}
.hero-desc{font-family:'Exo 2',sans-serif;font-size:9px;font-weight:600;letter-spacing:2px;color:var(--mu);text-transform:uppercase;}
.hero-line{width:50px;height:2px;background:linear-gradient(90deg,transparent,var(--gn),transparent);margin:12px auto 0;}

/* SEARCH */
.search-wrap{position:sticky;top:44px;z-index:99;background:rgba(6,15,8,.95);border-bottom:1px solid rgba(0,230,118,.1);padding:8px 12px;backdrop-filter:blur(12px);}
.search-inner{max-width:860px;margin:0 auto;position:relative;}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:11px;pointer-events:none;}
.search-inp{width:100%;height:34px;background:var(--s2);border:1px solid var(--br2);border-radius:7px;color:var(--tx);font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:600;padding:0 34px 0 32px;outline:none;transition:border-color .2s,box-shadow .2s;}
.search-inp::placeholder{color:var(--mu);}
.search-inp:focus{border-color:var(--gn);box-shadow:0 0 0 2px rgba(0,230,118,.1);}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--mu);cursor:pointer;font-size:11px;display:none;padding:4px;transition:color .2s;}
.search-clear:hover{color:var(--gn);}
.search-clear.show{display:block;}

/* CONTENT */
.content{max-width:860px;margin:0 auto;padding:12px 10px 36px;position:relative;z-index:1;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px;}
.stat-box{background:var(--s1);border:1px solid var(--br);border-radius:9px;padding:10px 8px;text-align:center;animation:borderPulse 3s ease-in-out infinite;}
.stat-num{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;color:var(--gn);text-shadow:0 0 12px rgba(0,230,118,.4);}
.stat-lbl{font-family:'Exo 2',sans-serif;font-size:7px;font-weight:800;letter-spacing:1.5px;color:var(--mu);text-transform:uppercase;margin-top:3px;}

/* TABLE */
.tbl-container{background:var(--s1);border:1px solid var(--br);border-radius:11px;overflow:hidden;}
.tbl-wrap{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed;}

/* Column widths — tight but readable */
.tbl col.c-rank   { width: 36px; }
.tbl col.c-player { width: auto; }
.tbl col.c-trials { width: 60px; }
.tbl col.c-score  { width: 62px; }
.tbl col.c-rating { width: 72px; }
.tbl col.c-status { width: 88px; }

.tbl thead{position:sticky;top:0;z-index:10;}
.tbl thead tr{background:var(--s2);}
.tbl thead th{
  padding:8px 6px;
  font-family:'Exo 2',sans-serif;
  font-size:7px;
  font-weight:800;
  letter-spacing:1px;
  color:var(--gn);
  text-transform:uppercase;
  border-bottom:1px solid rgba(0,230,118,.18);
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
}
.tbl thead th.th-player{text-align:left;padding-left:8px;}
.tbl thead th i{margin-right:3px;opacity:.7;}
.tbl tbody tr{border-bottom:1px solid var(--br);transition:background .15s;animation:fadeUp .3s ease both;}
.tbl tbody tr:last-child{border-bottom:none;}
.tbl tbody tr:hover{background:rgba(0,230,118,.04);}
.tbl tbody td{
  padding:7px 6px;
  color:var(--mu);
  vertical-align:middle;
  text-align:center;
  overflow:hidden;
  text-overflow:ellipsis;
}
.tbl tbody td.td-player{text-align:left;padding-left:8px;}

/* Rank */
.rank-num{
  font-family:'Exo 2',sans-serif;
  font-size:10px;
  font-weight:700;
  color:var(--mu);
  display:block;
}

/* Player name */
.player-name{
  font-family:'Exo 2',sans-serif;
  font-size:11px;
  font-weight:700;
  color:var(--gn3);
  text-decoration:none;
  transition:color .2s;
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
a.player-name:hover{color:var(--gn);}

/* Trials count */
.trials-cell{
  font-family:'Exo 2',sans-serif;
  font-size:11px;
  font-weight:700;
  color:var(--cy);
}

/* Score */
.score-val{
  font-family:'Exo 2',sans-serif;
  font-size:11px;
  font-weight:800;
}

/* Rating */
.rtg-excellent{color:var(--gn);font-family:'Exo 2',sans-serif;font-size:10px;font-weight:800;}
.rtg-good{color:var(--cy);font-family:'Exo 2',sans-serif;font-size:10px;font-weight:800;}
.rtg-average{color:var(--or);font-family:'Exo 2',sans-serif;font-size:10px;font-weight:800;}
.rtg-poor{color:var(--rd);font-family:'Exo 2',sans-serif;font-size:10px;font-weight:800;}

/* Status badge */
.status-eligible{
  display:inline-flex;align-items:center;gap:3px;
  font-family:'Exo 2',sans-serif;font-size:8px;font-weight:800;letter-spacing:.3px;
  color:var(--gn);background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.3);
  padding:3px 7px;border-radius:20px;cursor:pointer;transition:all .2s;
  text-decoration:none;white-space:nowrap;
}
.status-eligible:hover{background:rgba(0,230,118,.2);transform:translateY(-1px);}
.status-eligible i{font-size:7px;}
.status-waiting{
  display:inline-flex;align-items:center;gap:3px;
  font-family:'Exo 2',sans-serif;font-size:8px;font-weight:800;letter-spacing:.3px;
  color:var(--or);background:rgba(255,171,64,.08);border:1px solid rgba(255,171,64,.25);
  padding:3px 7px;border-radius:20px;white-space:nowrap;
}
.status-waiting i{font-size:7px;}

/* PAGINATION */
.pagination{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:12px;flex-wrap:wrap;}
.pg-btn{min-width:28px;height:28px;padding:0 6px;background:var(--s1);border:1px solid var(--br2);border-radius:5px;color:var(--mu);font-family:'Exo 2',sans-serif;font-size:10px;font-weight:800;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;}
.pg-btn:hover{border-color:rgba(0,230,118,.4);color:var(--gn);}
.pg-btn.active{border-color:var(--gn);background:rgba(0,230,118,.12);color:var(--gn);}
.pg-btn:disabled{opacity:.35;cursor:not-allowed;}
.pg-info{font-family:'Exo 2',sans-serif;font-size:8px;font-weight:700;color:var(--mu);letter-spacing:1px;text-align:center;margin-top:6px;}

/* EMPTY / LOADING */
.state-row td{text-align:center;padding:32px 20px!important;color:var(--mu);}
.state-row i{font-size:20px;display:block;margin-bottom:8px;color:var(--mu2);}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,230,118,.15);border-top-color:var(--gn);border-radius:50%;animation:spin .6s linear infinite;}

/* FOOTER */
footer{position:relative;z-index:1;text-align:center;padding:14px;border-top:1px solid rgba(0,230,118,.1);background:rgba(6,15,8,.7);}
.footer-text{font-family:'Exo 2',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;color:var(--mu);text-transform:uppercase;}
.footer-text span{color:var(--gn);}
.footer-text a{color:var(--gn);text-decoration:none;}
.footer-text a:hover{text-shadow:0 0 8px rgba(0,230,118,.5);}

@media(max-width:480px){
  .hero-title{font-size:16px;letter-spacing:3px;}
  .stat-num{font-size:15px;}
  .tbl col.c-rank   { width: 28px; }
  .tbl col.c-trials { width: 48px; }
  .tbl col.c-score  { width: 52px; }
  .tbl col.c-rating { width: 60px; }
  .tbl col.c-status { width: 76px; }
  .tbl thead th,.tbl tbody td{padding:6px 4px;}
  .tbl tbody td.td-player{padding-left:6px;}
  .tbl thead th.th-player{padding-left:6px;}
  .admin-btn span{display:none;}
  .admin-btn{padding:5px 8px;}
  .player-name{font-size:10px;}
  .trials-cell,.score-val{font-size:10px;}
  .rtg-excellent,.rtg-good,.rtg-average,.rtg-poor{font-size:9px;}
  .status-eligible,.status-waiting{font-size:7px;padding:2px 5px;}
}
</style>
</head>
<body>

<div class="topbar">
  <a href="https://goatfcbd.com" class="top-left">
    <img src="https://i.imgur.com/LY3Bb9m.png" class="top-logo" alt="GOAT FC"/>
    <div class="top-title">GOAT FC</div>
  </a>
  <div>
    <a href="https://goatfcbd.com/admin/trial/" class="admin-btn" target="_blank">
      <i class="fa-solid fa-shield-halved"></i><span>Admin Login</span>
    </a>
  </div>
</div>

<div class="hero">
  <div class="hero-badge"><i class="fa-solid fa-circle-dot"></i> Live Tracker</div>
  <div class="hero-title">TRIAL <span>TRACKER</span></div>
  <div class="hero-desc"><i class="fa-solid fa-crosshairs" style="color:var(--gn);margin-right:5px;"></i>Track trial players, scores & eligibility status — updated live</div>
  <div class="hero-line"></div>
</div>

<div class="search-wrap">
  <div class="search-inner">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input class="search-inp" type="text" id="searchInp" placeholder="Search player name..." oninput="onSearch(this)"/>
    <button class="search-clear" id="searchClear" onclick="clearSearch()"><i class="fa-solid fa-xmark"></i></button>
  </div>
</div>

<div class="content">
  <div class="stats-row">
    <div class="stat-box"><div class="stat-num" id="st-total">—</div><div class="stat-lbl"><i class="fa-solid fa-users"></i> Total Players</div></div>
    <div class="stat-box"><div class="stat-num" id="st-eli">—</div><div class="stat-lbl"><i class="fa-solid fa-check-circle"></i> Eligible</div></div>
    <div class="stat-box"><div class="stat-num" id="st-wait">—</div><div class="stat-lbl"><i class="fa-solid fa-hourglass-half"></i> Waiting</div></div>
  </div>

  <div class="tbl-container">
    <div class="tbl-wrap">
      <table class="tbl">
        <colgroup>
          <col class="c-rank"/>
          <col class="c-player"/>
          <col class="c-trials"/>
          <col class="c-score"/>
          <col class="c-rating"/>
          <col class="c-status"/>
        </colgroup>
        <thead>
          <tr>
            <th><i class="fa-solid fa-hashtag"></i>#</th>
            <th class="th-player"><i class="fa-solid fa-user-ninja"></i>Player</th>
            <th><i class="fa-solid fa-clipboard-check"></i>Trials</th>
            <th><i class="fa-solid fa-chart-bar"></i>Score</th>
            <th><i class="fa-solid fa-star"></i>Rating</th>
            <th><i class="fa-solid fa-shield-check"></i>Status</th>
          </tr>
        </thead>
        <tbody id="tBody">
          <tr class="state-row"><td colspan="6"><span class="spinner"></span> Loading players...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="pagination" id="pagination"></div>
  <div class="pg-info" id="pgInfo"></div>
</div>

<footer>
  <div class="footer-text">
    <i class="fa-solid fa-bolt" style="color:var(--gn);margin-right:5px;"></i>
    Powered by <span><a href="https://goatfcbd.com" target="_blank">GOAT FC</a></span>
    <i class="fa-solid fa-bolt" style="color:var(--gn);margin-left:5px;"></i>
  </div>
</footer>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQo9bp1MIrXbcwCY8z23bLmut7WdoOVvDpBCMO-9ku6REH2l5WgD9tBoA4Wl6ZMCb65ZA_4N06twOr4/pub?gid=725906971&single=true&output=csv';
const GOATFC_MSG_URL = 'https://www.facebook.com/goatfc.official';
const PER_PAGE = 20;

let allRows = [], filtered = [], currentPage = 1;

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = splitCSVLine(lines[i]);
    if (!cols[0] || cols[0].trim() === '') continue;
    rows.push({
      name: cols[0]?.trim() || '',
      fb: cols[1]?.trim() || '',
      reviews: parseInt(cols[2]?.trim()) || 0,
      avgScore: parseFloat(cols[3]?.trim()) || 0,
      rating: cols[4]?.trim() || '',
      reviewedBy: cols[5]?.trim() || '',
      status: cols[6]?.trim() || ''
    });
  }
  return rows.reverse();
}

function splitCSVLine(line) {
  const result = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
    else { cur += c; }
  }
  result.push(cur);
  return result;
}

async function loadData() {
  try {
    const r = await fetch(CSV_URL + '&_=' + Date.now());
    const text = await r.text();
    allRows = parseCSV(text);
    filtered = [...allRows];
    currentPage = 1;
    updateStats();
    render();
  } catch (e) {
    document.getElementById('tBody').innerHTML = `<tr class="state-row"><td colspan="6"><i class="fa-solid fa-triangle-exclamation"></i>Could not load data. Please try again.</td></tr>`;
  }
}

function updateStats() {
  const src = filtered.length ? filtered : allRows;
  const eli = src.filter(r => r.status.toLowerCase().includes('eligible')).length;
  document.getElementById('st-total').textContent = src.length;
  document.getElementById('st-eli').textContent = eli;
  document.getElementById('st-wait').textContent = src.length - eli;
}

function ratingText(rating) {
  const r = rating.toLowerCase();
  if (r.includes('excellent')) return `<span class="rtg-excellent">Excellent</span>`;
  if (r.includes('good')) return `<span class="rtg-good">Good</span>`;
  if (r.includes('average')) return `<span class="rtg-average">Average</span>`;
  if (r.includes('poor')) return `<span class="rtg-poor">Poor</span>`;
  return `<span class="rtg-average">${rating || '—'}</span>`;
}

function statusBadge(status) {
  const s = status.toLowerCase();
  if (s.includes('eligible')) {
    return `<a class="status-eligible" href="${GOATFC_MSG_URL}" target="_blank"><i class="fa-solid fa-check-circle"></i>Eligible</a>`;
  }
  return `<span class="status-waiting"><i class="fa-solid fa-hourglass-half"></i>Waiting</span>`;
}

function scoreColor(pct) {
  if (pct >= 80) return 'var(--gn)';
  if (pct >= 60) return 'var(--cy)';
  return 'var(--or)';
}

function render() {
  const tbody = document.getElementById('tBody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr class="state-row"><td colspan="6"><i class="fa-solid fa-user-slash"></i>No players found.</td></tr>`;
    renderPagination(0); updateStats(); return;
  }
  const totalPages = Math.ceil(filtered.length / PER_PAGE);
  if (currentPage > totalPages) currentPage = 1;
  const start = (currentPage - 1) * PER_PAGE;
  const end = Math.min(start + PER_PAGE, filtered.length);
  const pageRows = filtered.slice(start, end);

  tbody.innerHTML = pageRows.map((r, i) => {
    const globalIdx = start + i + 1;
    const sc = Math.round(r.avgScore);
    const col = scoreColor(sc);
    const nameEl = r.fb
      ? `<a class="player-name" href="${r.fb}" target="_blank">${r.name || '—'}</a>`
      : `<span class="player-name" style="color:var(--tx);">${r.name || '—'}</span>`;
    return `<tr style="animation-delay:${i * 0.025}s">
      <td><span class="rank-num">${globalIdx}</span></td>
      <td class="td-player">${nameEl}</td>
      <td><span class="trials-cell">${r.reviews}</span></td>
      <td><span class="score-val" style="color:${col}">${sc}%</span></td>
      <td>${ratingText(r.rating)}</td>
      <td>${statusBadge(r.status)}</td>
    </tr>`;
  }).join('');

  renderPagination(totalPages);
  updateStats();
}

function renderPagination(totalPages) {
  const pg = document.getElementById('pagination');
  const info = document.getElementById('pgInfo');
  if (totalPages <= 1) { pg.innerHTML = ''; info.textContent = ''; return; }
  const start = (currentPage - 1) * PER_PAGE + 1;
  const end = Math.min(currentPage * PER_PAGE, filtered.length);
  info.textContent = `Showing ${start}–${end} of ${filtered.length} players`;
  let html = `<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}><i class="fa-solid fa-chevron-left"></i></button>`;
  const range = paginationRange(currentPage, totalPages);
  range.forEach(p => {
    if (p === '...') html += `<span class="pg-btn" style="cursor:default;opacity:.4">···</span>`;
    else html += `<button class="pg-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
  });
  html += `<button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}><i class="fa-solid fa-chevron-right"></i></button>`;
  pg.innerHTML = html;
}

function paginationRange(cur, total) {
  if (total <= 7) return Array.from({length:total},(_,i)=>i+1);
  const r = [1];
  if (cur > 3) r.push('...');
  for (let i = Math.max(2,cur-1); i <= Math.min(total-1,cur+1); i++) r.push(i);
  if (cur < total-2) r.push('...');
  r.push(total); return r;
}

function goPage(p) {
  if (p < 1 || p > Math.ceil(filtered.length / PER_PAGE)) return;
  currentPage = p; render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function onSearch(inp) {
  const q = inp.value.trim().toLowerCase();
  document.getElementById('searchClear').classList.toggle('show', q.length > 0);
  filtered = q ? allRows.filter(r => r.name.toLowerCase().includes(q)) : [...allRows];
  currentPage = 1; render();
}

function clearSearch() {
  document.getElementById('searchInp').value = '';
