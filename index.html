<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GOAT FC — Player Roster</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
:root {
  --bg: #03040d;
  --card-bg: #080c1a;
  --card-border: #0f1530;
  --cyan: #00f5ff;
  --cyan-dim: rgba(0,245,255,0.12);
  --cyan-glow: rgba(0,245,255,0.35);
  --green: #00ff88;
  --green-dim: rgba(0,255,136,0.1);
  --purple: #b56cff;
  --purple-dim: rgba(181,108,255,0.12);
  --yellow: #ffe033;
  --yellow-dim: rgba(255,224,51,0.1);
  --red: #ff3d6b;
  --white: #eef2ff;
  --muted: #4a5580;
  --text-dim: #8896cc;
}

* { margin:0; padding:0; box-sizing:border-box; }

@keyframes rgbShift {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes scanline {
  0%   { transform: translateY(-100%); opacity: 0; }
  10%  { opacity: 0.4; }
  90%  { opacity: 0.4; }
  100% { transform: translateY(2000%); opacity: 0; }
}
@keyframes borderRgb {
  0%   { border-color: rgba(0,245,255,0.3); box-shadow: 0 0 18px rgba(0,245,255,0.12), inset 0 0 18px rgba(0,245,255,0.03); }
  33%  { border-color: rgba(181,108,255,0.3); box-shadow: 0 0 18px rgba(181,108,255,0.12), inset 0 0 18px rgba(181,108,255,0.03); }
  66%  { border-color: rgba(0,255,136,0.3); box-shadow: 0 0 18px rgba(0,255,136,0.12), inset 0 0 18px rgba(0,255,136,0.03); }
  100% { border-color: rgba(0,245,255,0.3); box-shadow: 0 0 18px rgba(0,245,255,0.12), inset 0 0 18px rgba(0,245,255,0.03); }
}
@keyframes pulseGlow {
  0%,100% { opacity:0.5; transform: scale(1); }
  50%      { opacity:1;   transform: scale(1.04); }
}
@keyframes fadeUp {
  from { opacity:0; transform: translateY(16px); }
  to   { opacity:1; transform: translateY(0); }
}
@keyframes shimmer {
  0%   { background-position: -200% center; }
  100% { background-position: 200% center; }
}
@keyframes cornerPulse {
  0%,100% { opacity: 0.4; }
  50%      { opacity: 1; }
}
@keyframes dotBlink {
  0%,100% { opacity:1; }
  50%      { opacity:0.2; }
}
@keyframes hexSpin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes statFlash {
  0%,100% { opacity:1; }
  50%      { opacity: 0.5; }
}

html, body { background: var(--bg); font-family: 'Rajdhani', sans-serif; color: var(--white); overflow-x: hidden; min-height: 100vh; }

body::before {
  content: "";
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 10% 0%, rgba(0,245,255,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 90% 100%, rgba(181,108,255,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 50% 50%, rgba(0,255,136,0.02) 0%, transparent 70%);
  z-index: 0; pointer-events: none;
}

body::after {
  content: "";
  position: fixed; inset: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(0,245,255,0.015) 39px, rgba(0,245,255,0.015) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(0,245,255,0.01) 39px, rgba(0,245,255,0.01) 40px);
  z-index: 0; pointer-events: none;
}

.scanline-anim {
  position: fixed; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(0,245,255,0.3), transparent);
  z-index: 9999; pointer-events: none;
  animation: scanline 6s linear infinite;
}

/* TOPBAR */
.topbar {
  height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
  background: rgba(3,4,13,0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(0,245,255,0.1);
  position: sticky; top: 0; z-index: 999;
  text-decoration: none;
}
.topbar::after {
  content: "";
  position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan), rgba(181,108,255,0.5), var(--cyan), transparent);
  animation: borderRgb 4s linear infinite;
}

.top-left { display:flex; align-items:center; gap:10px; }
.top-logo { width:26px; filter: drop-shadow(0 0 8px var(--cyan)); }
.top-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 11px; font-weight: 800; letter-spacing: 2px;
  background: linear-gradient(90deg, var(--cyan), #ffffff, var(--green));
  background-size: 200% auto;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: shimmer 3s linear infinite;
}
.home-btn {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px;
  background: rgba(0,245,255,0.06);
  border: 1px solid rgba(0,245,255,0.2);
  color: var(--cyan); font-size: 12px;
  transition: all 0.2s;
}
.home-btn:hover { background: rgba(0,245,255,0.14); box-shadow: 0 0 12px var(--cyan-glow); }

/* HERO */
.hero {
  padding: 26px 16px 20px;
  text-align: center;
  position: relative; z-index: 1;
}

.hero-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 14px;
  border-radius: 999px;
  border: 1px solid rgba(0,245,255,0.25);
  background: rgba(0,245,255,0.06);
  font-size: 10px; font-weight: 700; letter-spacing: 3px;
  color: var(--cyan);
  margin-bottom: 12px;
  text-transform: uppercase;
}

.hero-badge-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 6px var(--cyan);
  animation: dotBlink 1.4s ease-in-out infinite;
}

.hero-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 28px; font-weight: 900; letter-spacing: 2px;
  line-height: 1.1;
  background: linear-gradient(90deg, var(--cyan) 0%, #ffffff 40%, var(--green) 80%, var(--cyan) 100%);
  background-size: 300% auto;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: shimmer 4s linear infinite;
}

.hero-sub {
  margin-top: 8px;
  font-size: 10px; font-weight: 700; letter-spacing: 4px;
  color: var(--muted); text-transform: uppercase;
}

/* WRAP */
.wrap { width: min(100% - 20px, 1400px); margin: auto; position: relative; z-index: 1; }

/* SEARCH */
.search-wrap {
  position: relative; margin-bottom: 20px;
}
.search-icon {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  color: var(--cyan); font-size: 14px; opacity: 0.6; pointer-events: none;
}
.search-box {
  width: 100%; height: 50px;
  padding: 0 18px 0 46px;
  border-radius: 14px;
  border: 1px solid rgba(0,245,255,0.15);
  background: linear-gradient(145deg, rgba(8,12,26,0.9), rgba(12,18,36,0.9));
  outline: none; color: white;
  font-size: 14px; font-weight: 700;
  font-family: 'Rajdhani', sans-serif;
  transition: all 0.25s;
}
.search-box::placeholder { color: var(--muted); }
.search-box:focus {
  border-color: rgba(0,245,255,0.4);
  box-shadow: 0 0 0 3px rgba(0,245,255,0.07), 0 0 20px rgba(0,245,255,0.1);
}

/* STATS BAR */
.stats-bar {
  display: flex; gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.stat-pill {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 14px;
  border-radius: 10px;
  background: rgba(8,12,26,0.8);
  border: 1px solid rgba(255,255,255,0.06);
  font-size: 11px; font-weight: 700; letter-spacing: 1px;
}
.stat-pill-num {
  font-family: 'Orbitron', sans-serif;
  font-size: 14px; font-weight: 800;
}
.stat-pill-label { color: var(--muted); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
.stat-total .stat-pill-num { color: var(--cyan); }
.stat-showing .stat-pill-num { color: var(--green); }
.stat-dot {
  width: 6px; height: 6px; border-radius: 50%;
}
.stat-total .stat-dot { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); animation: dotBlink 2s infinite; }
.stat-showing .stat-dot { background: var(--green); box-shadow: 0 0 6px var(--green); }

/* GRID */
.players-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 14px;
}

/* CARD */
.card {
  position: relative;
  border-radius: 18px;
  background: linear-gradient(145deg, #090d1f, #070a18);
  border: 1px solid rgba(0,245,255,0.12);
  overflow: hidden;
  transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
  animation: fadeUp 0.4s ease both;
}

.card::before {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(0,245,255,0.03) 0%, transparent 50%, rgba(181,108,255,0.02) 100%);
  pointer-events: none;
}

.card:hover {
  transform: translateY(-5px);
  border-color: rgba(0,245,255,0.28);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 24px rgba(0,245,255,0.1);
}

.card:hover .rgb-stripe { animation-play-state: running; }

/* RGB stripe top */
.rgb-stripe {
  height: 2px;
  background: linear-gradient(90deg, var(--cyan), var(--purple), var(--green), var(--yellow), var(--cyan));
  background-size: 300% 100%;
  animation: rgbShift 2.5s linear infinite;
  animation-play-state: paused;
}
.card:hover .rgb-stripe { animation-play-state: running; }

/* Corner accents */
.corner-tl, .corner-tr, .corner-bl, .corner-br {
  position: absolute; width: 14px; height: 14px; pointer-events: none;
  animation: cornerPulse 2s ease-in-out infinite;
}
.corner-tl { top: 12px; left: 12px; border-top: 1px solid var(--cyan); border-left: 1px solid var(--cyan); }
.corner-tr { top: 12px; right: 12px; border-top: 1px solid var(--cyan); border-right: 1px solid var(--cyan); }
.corner-bl { bottom: 12px; left: 12px; border-bottom: 1px solid var(--cyan); border-left: 1px solid var(--cyan); }
.corner-br { bottom: 12px; right: 12px; border-bottom: 1px solid var(--cyan); border-right: 1px solid var(--cyan); }

/* CARD INNER */
.card-inner { padding: 14px; }

/* PLAYER HEADER */
.player-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-bottom: 12px;
}

.player-avatar {
  width: 46px; height: 46px; flex-shrink: 0;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(0,245,255,0.12), rgba(181,108,255,0.08));
  border: 1px solid rgba(0,245,255,0.2);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Orbitron', sans-serif;
  font-size: 16px; font-weight: 900;
  color: var(--cyan);
  text-shadow: 0 0 10px var(--cyan);
  position: relative; overflow: hidden;
}
.player-avatar::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(0,245,255,0.06), transparent);
}

.player-meta { flex: 1; min-width: 0; }

.player-name {
  font-family: 'Orbitron', sans-serif;
  font-size: 14px; font-weight: 800; letter-spacing: 0.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--white);
  text-shadow: 0 0 12px rgba(238,242,255,0.15);
}

.player-handle {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px; color: var(--muted);
  margin-top: 2px; letter-spacing: 0.5px;
}

.club-badge {
  display: flex; align-items: center; gap: 5px;
  padding: 6px 10px;
  border-radius: 8px;
  background: rgba(0,245,255,0.07);
  border: 1px solid rgba(0,245,255,0.18);
  flex-shrink: 0;
}
.club-badge-icon { color: var(--cyan); font-size: 12px; }
.club-badge-id {
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px; color: var(--cyan);
  letter-spacing: 0.5px;
}

/* DIVIDER */
.card-divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,245,255,0.15), transparent);
  margin-bottom: 12px;
}

/* STATS ROW */
.stats-row {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; margin-bottom: 10px;
}

.stat-box {
  padding: 10px 11px;
  border-radius: 11px;
  background: rgba(5,8,20,0.8);
  border: 1px solid rgba(255,255,255,0.05);
  position: relative; overflow: hidden;
}

.stat-box::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  opacity: 0.4;
}

.stat-box.konami::before { background: linear-gradient(90deg, transparent, var(--yellow), transparent); }
.stat-box.device::before { background: linear-gradient(90deg, transparent, var(--purple), transparent); }

.stat-box-top {
  display: flex; align-items: center; gap: 5px;
  margin-bottom: 5px;
}
.stat-box-icon { font-size: 11px; }
.stat-box.konami .stat-box-icon { color: var(--yellow); }
.stat-box.device .stat-box-icon { color: var(--purple); }

.stat-box-label {
  font-size: 9px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--muted);
}

.stat-box-val {
  font-size: 13px; font-weight: 800;
  word-break: break-word; line-height: 1.2;
}
.stat-box.konami .stat-box-val { color: var(--yellow); text-shadow: 0 0 8px rgba(255,224,51,0.4); }
.stat-box.device .stat-box-val { color: var(--purple); text-shadow: 0 0 8px rgba(181,108,255,0.4); }

/* FB BUTTON */
.fb-btn {
  display: flex; align-items: center; justify-content: center; gap: 9px;
  height: 42px; width: 100%;
  border-radius: 11px;
  text-decoration: none;
  background: rgba(24,119,242,0.07);
  border: 1px solid rgba(24,119,242,0.2);
  color: #6ab0ff;
  font-family: 'Rajdhani', sans-serif;
  font-size: 12px; font-weight: 800; letter-spacing: 1.5px;
  text-transform: uppercase;
  transition: all 0.22s;
  position: relative; overflow: hidden;
}
.fb-btn::before {
  content: "";
  position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(78,161,255,0.1), transparent);
  transition: left 0.4s;
}
.fb-btn:hover { border-color: rgba(24,119,242,0.45); box-shadow: 0 0 16px rgba(24,119,242,0.2); color: #90c8ff; }
.fb-btn:hover::before { left: 100%; }

/* EMPTY */
.empty {
  grid-column: 1 / -1;
  padding: 60px 20px; text-align: center;
}
.empty-icon { font-size: 32px; color: var(--muted); margin-bottom: 16px; }
.empty-text { font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 3px; color: var(--muted); }

/* LOADING */
.loading-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 60px 20px;
  grid-column: 1/-1;
}
.load-ring {
  width: 48px; height: 48px; border-radius: 50%;
  border: 2px solid rgba(0,245,255,0.1);
  border-top-color: var(--cyan);
  animation: hexSpin 0.8s linear infinite;
  margin-bottom: 16px;
}
.load-text {
  font-family: 'Orbitron', sans-serif;
  font-size: 9px; letter-spacing: 4px; color: var(--muted);
}

/* FOOTER */
.footer {
  margin-top: 28px; margin-bottom: 10px;
  text-align: center;
  font-size: 9px; font-weight: 700; letter-spacing: 4px;
  color: rgba(74,85,128,0.6); text-transform: uppercase;
}

/* MOBILE */
@media (max-width: 600px) {
  .players-grid { grid-template-columns: 1fr; gap: 10px; }
  .hero-title { font-size: 22px; }
  .player-name { font-size: 12px; }
  .stats-bar { gap: 7px; }
}
</style>
</head>
<body>

<div class="scanline-anim"></div>

<a href="https://goatfcbd.com" class="topbar">
  <div class="top-left">
    <img src="https://i.imgur.com/LY3Bb9m.png" class="top-logo" alt="GOAT FC">
    <div class="top-title">GOAT FC</div>
  </div>
  <div class="home-btn"><i class="fa-solid fa-house"></i></div>
</a>

<div class="hero">
  <div class="hero-badge">
    <span class="hero-badge-dot"></span>
    LIVE ROSTER
  </div>
  <div class="hero-title">PLAYER ROSTER</div>
  <div class="hero-sub">CLUB ID · KONAMI ID · DEVICE · FACEBOOK</div>
</div>

<div class="wrap">

  <div class="search-wrap">
    <i class="fa-solid fa-crosshairs search-icon"></i>
    <input type="text" id="searchInput" class="search-box" placeholder="Search by Club ID, Name...">
  </div>

  <div class="stats-bar">
    <div class="stat-pill stat-total">
      <span class="stat-dot"></span>
      <span class="stat-pill-num" id="totalCount">0</span>
      <span class="stat-pill-label">Total Players</span>
    </div>
    <div class="stat-pill stat-showing">
      <span class="stat-dot"></span>
      <span class="stat-pill-num" id="showingCount">0</span>
      <span class="stat-pill-label">Showing</span>
    </div>
  </div>

  <div id="players" class="players-grid">
    <div class="loading-screen">
      <div class="load-ring"></div>
      <div class="load-text">LOADING SQUAD DATA...</div>
    </div>
  </div>

  <div class="footer">⬡ POWERED BY GOAT FC ⬡</div>

</div>

<script>
const csvURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRxNxMgcwsp3k8B9jqnfObnnRfhSX3vUcEOuaPTsyEMaEVOZKE9OIcLiMQRJHHkAQiJWn-msKE6Cs80/pub?output=csv";

let allPlayers = [];

function normalize(str) {
  return (str || "").toLowerCase().replace(/[^a-z0-9]/g, "");
}

function initials(name) {
  return (name || "??").split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase();
}

function loadData() {
  Papa.parse(csvURL, {
    download: true, header: true, skipEmptyLines: true,
    complete: function(res) {
      allPlayers = res.data;
      document.getElementById("totalCount").textContent = allPlayers.length;
      render(allPlayers);
    }
  });
}

function render(data) {
  const wrap = document.getElementById("players");
  document.getElementById("showingCount").textContent = data.length;

  if (data.length === 0) {
    wrap.innerHTML = `
      <div class="empty">
        <div class="empty-icon"><i class="fa-solid fa-satellite-dish"></i></div>
        <div class="empty-text">No Signal — Player Not Found</div>
      </div>`;
    return;
  }

  wrap.innerHTML = data.map((p, i) => {
    const name   = p["Player Name"] || "Unknown";
    const clubId = p["Your Club ID"] || "N/A";
    const konami = p["KONAMI ID"] || "N/A";
    const device = p["DEVICE NAME"] || "N/A";
    const fbUrl  = p["Facebook URL"] || "#";
    const inits  = initials(name);

    return `
    <div class="card" style="animation-delay:${Math.min(i,12)*0.05}s">
      <div class="rgb-stripe"></div>
      <div class="corner-tl"></div>
      <div class="corner-tr"></div>
      <div class="corner-bl"></div>
      <div class="corner-br"></div>
      <div class="card-inner">
        <div class="player-header">
          <div class="player-avatar">${inits}</div>
          <div class="player-meta">
            <div class="player-name">${name}</div>
            <div class="player-handle">// REGISTERED PLAYER</div>
          </div>
          <div class="club-badge">
            <i class="fa-solid fa-shield-halved club-badge-icon"></i>
            <span class="club-badge-id">${clubId}</span>
          </div>
        </div>
        <div class="card-divider"></div>
        <div class="stats-row">
          <div class="stat-box konami">
            <div class="stat-box-top">
              <i class="fa-solid fa-gamepad stat-box-icon"></i>
              <span class="stat-box-label">Konami ID</span>
            </div>
            <div class="stat-box-val">${konami}</div>
          </div>
          <div class="stat-box device">
            <div class="stat-box-top">
              <i class="fa-solid fa-mobile-screen stat-box-icon"></i>
              <span class="stat-box-label">Device</span>
            </div>
            <div class="stat-box-val">${device}</div>
          </div>
        </div>
        <a href="${fbUrl}" target="_blank" class="fb-btn">
          <i class="fa-brands fa-facebook-f"></i>
          VISIT FACEBOOK
        </a>
      </div>
    </div>`;
  }).join("");
}

document.getElementById("searchInput").addEventListener("input", function() {
  const val = normalize(this.value);
  if (!val) { render(allPlayers); return; }
  render(allPlayers.filter(p =>
    normalize(p["Your Club ID"]).includes(val) ||
    normalize(p["Player Name"]).includes(val)
  ));
});

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
