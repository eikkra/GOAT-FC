<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAYER PROFILE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:#020617;
color:#fff;
overflow-x:hidden;
}

/* BG */
body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at top left,#00f5ff22,transparent 30%),
radial-gradient(circle at bottom right,#00f5ff11,transparent 30%);
z-index:-1;
}

/* HEADER */
.header{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
padding:14px 10px 6px;
}

.logo{
width:42px;
filter:drop-shadow(0 0 15px #00f5ff);
}

.title{
font-size:18px;
font-weight:700;
color:#00f5ff;
text-shadow:0 0 12px #00f5ff;
}

/* DESC */
.desc{
text-align:center;
font-size:11px;
color:#94a3b8;
margin-bottom:12px;
}

/* PROFILE */
.profile{
width:min(100% - 20px,900px);
margin:auto;
border-radius:20px;
overflow:hidden;
background:#08111f;
border:1px solid #00f5ff44;
box-shadow:0 0 25px #00f5ff22;
}

/* COVER */
.cover{
height:140px;
background:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.75)),
url('https://c4.wallpaperflare.com/wallpaper/398/874/541/champions-league-stadium-wallpaper-preview.jpg');
background-size:cover;
background-position:center;
}

/* TOP */
.top{
text-align:center;
margin-top:-55px;
padding:0 15px 15px;
}

/* AVATAR */
.avatar{
width:105px;
height:105px;
border-radius:50%;
object-fit:cover;
border:3px solid #00f5ff;
background:#0f172a;
box-shadow:
0 0 15px #00f5ff,
0 0 40px #00f5ff55;
}

/* NAME */
.name{
font-size:20px;
font-weight:700;
margin-top:10px;
}

/* CLUB */
.clubid{
margin-top:5px;
font-size:13px;
color:#00f5ff;
text-shadow:0 0 10px #00f5ff;
}

/* RANK */
.rank{
margin-top:10px;
display:inline-block;
padding:6px 14px;
border-radius:999px;
background:#00f5ff22;
border:1px solid #00f5ff;
font-size:12px;
color:#00f5ff;
box-shadow:0 0 10px #00f5ff33 inset;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
padding:15px;
}

/* BOX */
.box{
background:#0f172a;
border:1px solid #00f5ff33;
border-radius:12px;
padding:10px 6px;
text-align:center;
box-shadow:0 0 10px #00f5ff11 inset;
}

.label{
font-size:10px;
color:#94a3b8;
}

.value{
margin-top:5px;
font-size:15px;
font-weight:700;
color:#00f5ff;
text-shadow:0 0 10px #00f5ff33;
}

/* DOWNLOAD */
.download-wrap{
padding:0 15px 15px;
text-align:center;
}

.download-btn{
padding:10px 18px;
border:none;
border-radius:10px;
background:#00f5ff;
color:#000;
font-weight:700;
cursor:pointer;
box-shadow:0 0 15px #00f5ff;
}

/* MATCHES */
.matches{
padding:15px;
}

.matches-title{
text-align:center;
margin-bottom:10px;
color:#00f5ff;
font-weight:700;
}

.match{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
gap:8px;
background:#0f172a;
border:1px solid #1e293b;
padding:10px;
border-radius:12px;
margin-bottom:8px;
font-size:11px;
}

.left{
text-align:left;
}

.right{
text-align:right;
}

.center{
text-align:center;
}

.type{
font-size:9px;
margin-top:4px;
color:#94a3b8;
}

.score{
padding:5px 10px;
border-radius:8px;
font-weight:700;
}

.win{
background:#22c55e22;
color:#22c55e;
}

.loss{
background:#ef444422;
color:#ef4444;
}

.draw{
background:#eab30822;
color:#eab308;
}

/* MOBILE */
@media(max-width:768px){

.grid{
grid-template-columns:repeat(2,1fr);
}

.name{
font-size:18px;
}

}

</style>
</head>

<body>

<div class="header">
<img class="logo" src="https://i.imgur.com/LY3Bb9m.png">
<div class="title">GOAT FC PLAYER PROFILE</div>
</div>

<div class="desc">
Live player profile synced with official GOAT FC leaderboard
</div>

<div id="app"></div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>

/* =========================
   LINKS
========================= */

const MATCH_CSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv";

const MEMBER_CSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=133947099&single=true&output=csv";

const RANK_CSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1033046915&single=true&output=csv";

/* =========================
   PLAYER ID
========================= */

const params = new URLSearchParams(location.search);

function normalize(x){
return (x||"")
.toLowerCase()
.replace(/[^a-z0-9]/g,'');
}

const playerId = normalize(
params.get("id") || "GFC-001"
);

/* =========================
   CSV PARSER
========================= */

function parseCSV(text){

const rows=[];
let row=[];
let current='';
let inside=false;

for(let i=0;i<text.length;i++){

const c=text[i];
const next=text[i+1];

if(c === '"'){

if(inside && next === '"'){
current += '"';
i++;
}else{
inside=!inside;
}

}else if(c===',' && !inside){

row.push(current);
current='';

}else if((c==='\n'||c==='\r') && !inside){

if(current || row.length){
row.push(current);
rows.push(row);
}

row=[];
current='';

}else{
current+=c;
}
}

if(current || row.length){
row.push(current);
rows.push(row);
}

return rows;
}

/* =========================
   FIX IMAGE
========================= */

function fixImage(url){

if(!url)
return "https://i.imgur.com/LY3Bb9m.png";

const id = url.match(/[-\\w]{25,}/);

if(id){
return `https://drive.google.com/thumbnail?id=${id[0]}&sz=w1000`;
}

return url;
}

/* =========================
   LOAD
========================= */

async function load(){

try{

const [matchTxt,memberTxt,rankTxt] =
await Promise.all([

fetch(MATCH_CSV+"?t="+Date.now())
.then(r=>r.text()),

fetch(MEMBER_CSV+"?t="+Date.now())
.then(r=>r.text()),

fetch(RANK_CSV+"?t="+Date.now())
.then(r=>r.text())

]);

const matches = parseCSV(matchTxt);
const members = parseCSV(memberTxt);
const ranks = parseCSV(rankTxt);

/* =========================
   MEMBER MAP
========================= */

const memberMap={};

members.slice(1).forEach(r=>{

memberMap[normalize(r[1])] = {

name:r[0],
club:r[1],
pic:fixImage(r[2])

};

});

/* =========================
   LEADERBOARD MAP
========================= */

let rankInfo=null;

ranks.slice(1).forEach(r=>{

if(normalize(r[0])===playerId){

rankInfo={

monthlyRank:r[1],
overallRank:r[2],

monthlyPoint:r[4],
monthlyPL:r[5],
monthlyWin:r[6],

overallPoint:r[10],
overallPL:r[11],
overallWin:r[12],

gf:r[13],
ga:r[14],
gd:r[15],

friendly:r[16],
tournament:r[17]

};

}

});

/* =========================
   RECENT MATCHES
========================= */

let recent=[];

matches.slice(1).forEach(r=>{

if((r[9]||"").toLowerCase()!=="yes")
return;

const p1=normalize(r[0]);
const p2=normalize(r[1]);

if(p1!==playerId && p2!==playerId)
return;

recent.push({

p1:r[0],
p2:r[1],
type:r[2],
s1:r[3],
s2:r[4]

});

});

/* =========================
   PLAYER INFO
========================= */

const info =
memberMap[playerId] || {

name:"Unknown Player",
club:params.get("id") || "N/A",
pic:"https://i.imgur.com/LY3Bb9m.png"

};

/* =========================
   RENDER
========================= */

document.getElementById("app").innerHTML = `

<div class="profile" id="capture">

<div class="cover"></div>

<div class="top">

<img class="avatar"
src="${info.pic}"
onerror="this.src='https://i.imgur.com/LY3Bb9m.png'">

<div class="name">
${info.name}
</div>

<div class="clubid">
${info.club}
</div>

<div class="rank">
🏆 Overall Rank #${rankInfo?.overallRank || '-'}
</div>

</div>

<div class="grid">

<div class="box">
<div class="label">Monthly Rank</div>
<div class="value">${rankInfo?.monthlyRank || 0}</div>
</div>

<div class="box">
<div class="label">Monthly Win%</div>
<div class="value">${rankInfo?.monthlyWin || 0}</div>
</div>

<div class="box">
<div class="label">Overall Win%</div>
<div class="value">${rankInfo?.overallWin || 0}</div>
</div>

<div class="box">
<div class="label">Matches</div>
<div class="value">${rankInfo?.overallPL || 0}</div>
</div>

<div class="box">
<div class="label">Goals Scored</div>
<div class="value">${rankInfo?.gf || 0}</div>
</div>

<div class="box">
<div class="label">Goals Against</div>
<div class="value">${rankInfo?.ga || 0}</div>
</div>

<div class="box">
<div class="label">Difference</div>
<div class="value">${rankInfo?.gd || 0}</div>
</div>

<div class="box">
<div class="label">Monthly Point</div>
<div class="value">${rankInfo?.monthlyPoint || 0}</div>
</div>

<div class="box">
<div class="label">Overall Point</div>
<div class="value">${rankInfo?.overallPoint || 0}</div>
</div>

<div class="box">
<div class="label">Friendly Point</div>
<div class="value">${rankInfo?.friendly || 0}</div>
</div>

<div class="box">
<div class="label">Tournament Point</div>
<div class="value">${rankInfo?.tournament || 0}</div>
</div>

<div class="box">
<div class="label">Monthly Played</div>
<div class="value">${rankInfo?.monthlyPL || 0}</div>
</div>

</div>

<div class="download-wrap">
<button class="download-btn"
onclick="downloadProfile()">
Download Profile
</button>
</div>

<div class="matches">

<div class="matches-title">
Recent Matches
</div>

${recent.reverse().slice(0,5).map(m=>{

let me,op,cls;

if(normalize(m.p1)===playerId){

me=+m.s1;
op=+m.s2;

}else{

me=+m.s2;
op=+m.s1;

}

if(me>op) cls='win';
else if(me<op) cls='loss';
else cls='draw';

return `

<div class="match">

<div class="left">
${m.p1}
</div>

<div class="center">

<div class="score ${cls}">
${m.s1} - ${m.s2}
</div>

<div class="type">
${m.type}
</div>

</div>

<div class="right">
${m.p2}
</div>

</div>

`;

}).join('')}

</div>

</div>

`;

}catch(err){

document.getElementById("app").innerHTML = `
<div style="
text-align:center;
padding:50px;
color:#00f5ff;
">
Failed to load profile
</div>
`;

console.log(err);

}

}

/* =========================
   DOWNLOAD
========================= */

function downloadProfile(){

html2canvas(
document.getElementById("capture")
).then(canvas=>{

const a=document.createElement("a");

a.download="goatfc-profile.png";
a.href=canvas.toDataURL();

a.click();

});

}

load();

</script>

</body>
</html>
